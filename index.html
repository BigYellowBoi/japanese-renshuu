<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
*::-webkit-scrollbar-thumb:hover{background:#4b5563}
*{scrollbar-width:thin;scrollbar-color:#374151 transparent}
body{font-family:'Inter',sans-serif;background:#030712;color:#f3f4f6;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
#screen-quiz{display:flex;flex-direction:column;justify-content:center;min-height:100vh;min-height:100dvh}
.btn{border:none;cursor:pointer;font-family:inherit;font-size:14px;border-radius:12px;padding:10px 20px;font-weight:600;transition:all .15s}
.btn-primary{background:#ef4444;color:#fff}.btn-primary:hover{background:#f87171}
.btn-secondary{background:#1f2937;color:#d1d5db}.btn-secondary:hover{background:#374151}
.btn-ghost{background:transparent;color:#6b7280;padding:6px 12px}.btn-ghost:hover{color:#d1d5db}
.btn-full{width:100%}.btn-lg{padding:14px 24px;font-size:18px}.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.input{width:100%;background:#111827;border:1px solid #374151;border-radius:12px;padding:12px 16px;color:#f3f4f6;font-size:16px;font-family:inherit;outline:none;transition:border-color .15s}
.input:focus{border-color:#ef4444}.input::placeholder{color:#4b5563}
.stars{display:inline-flex;gap:2px}.star{font-size:14px}.star-1{color:#fbbf24}.star-2{color:#f97316}.star-3{color:#22d3ee}.star-empty{color:#4b5563}
.progress-bar{width:100%;background:#1f2937;border-radius:999px;overflow:hidden}
.progress-bar-sm{height:6px}.progress-bar-xs{height:4px}
.progress-fill{height:100%;background:#ef4444;border-radius:999px;transition:width .5s}
.menu-title{text-align:center;padding-top:16px;margin-bottom:24px}
.menu-title h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.menu-title .accent{color:#f87171}
.menu-title .subtitle{color:#6b7280;font-size:13px;margin-top:4px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.section-label{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cat-btn{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:8px;cursor:pointer;text-align:left;transition:all .15s;color:#9ca3af}
.cat-btn:hover{border-color:#374151}
.cat-btn.selected{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
.cat-btn .cat-icon{font-size:18px;margin-bottom:2px}
.cat-btn .cat-name{font-size:13px;font-weight:500;display:block}
.cat-btn .cat-stat{font-size:11px;opacity:.6}
.actions{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.actions-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.quiz-top .back{font-size:13px;color:#6b7280;cursor:pointer;background:none;border:none;font-family:inherit}
.quiz-top .back:hover{color:#d1d5db}
.quiz-top .stats{font-size:13px;color:#6b7280}
.info-btn{background:none;border:1px solid #374151;border-radius:50%;width:24px;height:24px;font-size:13px;color:#6b7280;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;line-height:1}
.info-btn:hover{border-color:#6b7280;color:#d1d5db}
.quiz-card{border-radius:16px;padding:10px 16px;text-align:center;margin:6px 0;transition:all .3s;border:2px solid #1f2937;background:#111827}
@media(min-height:700px){.quiz-card{padding:20px 24px;margin:12px 0}}
.quiz-card.correct{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.4)}
.quiz-card.tier-up{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.4);box-shadow:0 0 16px rgba(251,191,36,.1)}
.quiz-card.mastered{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.5);box-shadow:0 0 20px rgba(34,211,238,.15)}
.quiz-card.wrong{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.4)}
.quiz-cat{font-size:11px;color:#4b5563;margin-bottom:4px;display:block}
.quiz-hint-area{height:20px;margin-bottom:2px}
.quiz-furigana{color:#fca5a5;font-size:18px;font-family:'Noto Sans JP',sans-serif}
.quiz-japanese{font-size:40px;font-weight:700;margin-bottom:4px;font-family:'Noto Sans JP',sans-serif;letter-spacing:.02em;line-height:1.1}
.quiz-japanese.char-mode{font-size:64px;margin-bottom:2px}
.romaji-hint{font-size:13px;color:#4b5563;letter-spacing:.05em;margin-bottom:12px;height:18px}
.hint-btn{font-size:12px;color:#6b7280;border:1px solid #374151;border-radius:8px;padding:4px 12px;background:transparent;cursor:pointer;transition:color .15s}
.hint-btn:hover{color:#d1d5db}
.spacer-hint{height:8px}
.speak-btn{background:none;border:1px solid #374151;border-radius:8px;color:#9ca3af;cursor:pointer;font-size:16px;padding:2px 12px;margin-bottom:4px;transition:all .15s}
.speak-btn:hover{border-color:#6b7280;color:#f3f4f6}
.speak-btn-sm{background:none;border:none;color:#4b5563;cursor:pointer;font-size:13px;padding:2px 4px;transition:color .15s}
.speak-btn-sm:hover{color:#f3f4f6}
.feedback-correct{color:#34d399;font-size:20px;font-weight:700;margin-bottom:8px}
.feedback-wrong{color:#f87171;font-size:20px;font-weight:700;margin-bottom:8px}
.feedback-answers{color:#9ca3af;font-size:14px}
.feedback-answers .highlight{color:#fcd34d}
.feedback-typed{color:#6b7280;font-size:12px;margin-top:4px}
.input-row{display:flex;gap:8px}
.input-row .input{flex:1;border-radius:12px}
.input-row .btn{border-radius:12px;padding:12px 20px}
.done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.done-emoji{font-size:56px;margin-bottom:16px}
.done-title{font-size:24px;font-weight:700;margin-bottom:8px}
.done-stat{color:#9ca3af;margin-bottom:2px}
.done-pct{color:#6b7280;font-size:13px;margin-bottom:24px}
.done-actions{display:flex;flex-direction:column;gap:8px;width:260px}
.add-form{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.field-label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.add-msg{font-size:13px;margin-top:4px}.add-msg.error{color:#f87171}.add-msg.success{color:#34d399}
.custom-list{display:flex;flex-direction:column;gap:4px}
.custom-item{display:flex;align-items:center;justify-content:space-between;background:#111827;border-radius:8px;padding:8px 12px}
.custom-item-text{font-size:14px}.custom-item-text .jp{font-weight:500}
.custom-item-text .furi{color:#6b7280;font-size:12px;margin-left:6px}
.custom-item-text .en{color:#9ca3af;font-size:13px;margin-left:8px}
.delete-btn{background:none;border:none;color:#4b5563;cursor:pointer;font-size:14px;padding:4px 8px}
.delete-btn:hover{color:#f87171}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;border:1px solid #1f2937;background:#111827;color:#6b7280;transition:all .15s;font-family:inherit}
.filter-btn.active{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
.browse-header{position:sticky;top:0;background:#030712;z-index:10;padding:8px 0 4px 0}
.browse-body{display:flex;flex-direction:column}
.browse-main{flex:1;min-width:0}
.browse-back{font-size:13px;color:#6b7280;cursor:pointer;background:none;border:1px solid #374151;border-radius:20px;font-family:inherit;padding:6px 14px;transition:all .15s;margin-bottom:8px}
.browse-back:hover{color:#d1d5db;border-color:#6b7280}
.cat-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:8px 0;border-bottom:1px solid #1f2937}
.cat-nav-desktop{display:none!important}
.cat-nav-btn{font-size:11px;padding:4px 8px;border-radius:6px;cursor:pointer;border:1px solid #1f2937;background:#111827;color:#6b7280;transition:all .15s;font-family:inherit;white-space:nowrap}
.cat-nav-btn:hover{border-color:#374151;color:#d1d5db}
.browse-group-label{font-size:11px;color:#4b5563;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;margin-top:12px;padding:4px 0;scroll-margin-top:240px}
.browse-item{display:flex;align-items:center;justify-content:space-between;background:rgba(17,24,39,.5);border-radius:6px;padding:6px 12px;margin-bottom:2px;font-size:13px}
.browse-item .jp{font-weight:500}.browse-item .furi{color:#4b5563;font-size:11px;margin-left:6px}.browse-item .en{color:#6b7280;margin-left:8px}
.edit-btn{background:none;border:none;color:#4b5563;cursor:pointer;font-size:13px;padding:2px 6px;margin-left:4px;transition:color .15s}
.edit-btn:hover{color:#fbbf24}
.edit-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.edit-modal{background:#111827;border:1px solid #374151;border-radius:16px;padding:24px;max-width:420px;width:100%}
.edit-modal h3{font-size:18px;font-weight:700;margin-bottom:4px}
.edit-modal .edit-jp{color:#fca5a5;font-size:14px;margin-bottom:16px;font-family:'Noto Sans JP',sans-serif}
.edit-modal .edit-actions{display:flex;gap:8px;margin-top:16px}
.edit-modal .edit-actions .btn{flex:1}
.screen-title{font-size:20px;font-weight:700;margin-bottom:12px}
.volume-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 12px;background:#111827;border-radius:10px}
.volume-icon{cursor:pointer;font-size:18px;user-select:none;line-height:1}
.volume-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#374151;outline:none}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#ef4444;cursor:pointer;border:none}
.volume-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#ef4444;cursor:pointer;border:none}
.streak-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111827;border-radius:10px;margin-bottom:12px}
.mode-btn{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:500;cursor:pointer;color:#d1d5db;font-family:inherit;transition:all .15s;text-align:center}
.mode-btn.active{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#fca5a5}
.len-btn{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;color:#d1d5db;font-family:inherit;transition:all .15s}
.len-btn.active{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#fca5a5}
.choice-btn{background:#1f2937;border:1px solid #374151;border-radius:10px;padding:12px 8px;font-size:14px;cursor:pointer;color:#d1d5db;font-family:inherit;transition:all .15s;text-align:center}
.choice-btn:hover:not(:disabled){background:#374151}
@media(min-width:768px){
.app{max-width:960px;padding:24px 32px}
.menu-title h1{font-size:36px}
.cat-grid{grid-template-columns:repeat(4,1fr);gap:10px}
.actions{max-width:520px;margin-left:auto;margin-right:auto}
.streak-bar{max-width:520px;margin-left:auto;margin-right:auto}
.add-form{max-width:520px;margin-left:auto;margin-right:auto}
#screen-add .browse-back{display:block}
#screen-add .screen-title{max-width:520px;margin-left:auto;margin-right:auto}
#custom-list-section{max-width:520px;margin-left:auto;margin-right:auto}
.browse-body{flex-direction:row;gap:20px;height:calc(100vh - 160px)}
.cat-nav-mobile-wrap{display:none!important}
.cat-nav-desktop{display:flex!important;flex-direction:column;flex:0 0 180px;gap:4px;flex-wrap:nowrap;margin-bottom:0;padding-bottom:12px;border-bottom:none;border-right:1px solid #1f2937;padding-right:16px;overflow-y:auto;scrollbar-width:none}
.cat-nav-desktop::-webkit-scrollbar{display:none}
.cat-nav-btn{text-align:left;white-space:normal;font-size:12px;padding:6px 10px}
.browse-main{flex:1;overflow-y:auto}
.browse-group-label{scroll-margin-top:8px}
.browse-item{padding:8px 14px;font-size:14px}
.done-screen{max-width:520px;margin-left:auto;margin-right:auto}
.quiz-top{max-width:560px;margin-left:auto;margin-right:auto;width:100%}
.quiz-card{max-width:560px;margin-left:auto;margin-right:auto;width:100%}
#screen-quiz .progress-bar{max-width:560px;margin-left:auto;margin-right:auto}
}
@media(min-width:1100px){
.app{max-width:1100px}
.cat-grid{grid-template-columns:repeat(5,1fr)}
.cat-nav-desktop{flex:0 0 200px}
}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app">
<div id="screen-menu">
<div class="menu-title"><h1><span class="accent">日本語</span> 練習</h1><p class="subtitle" id="menu-mastered-text"></p><div class="progress-bar progress-bar-sm" style="margin-top:8px"><div class="progress-fill" id="menu-progress-fill"></div></div></div>
<div class="streak-bar" id="streak-bar"></div>
<div class="section-header"><span class="section-label">Categories</span><div><button class="btn-ghost btn-sm" onclick="selectGroup('jlpt')">JLPT</button><button class="btn-ghost btn-sm" onclick="selectGroup('beginner')">Beginner</button><button class="btn-ghost btn-sm" onclick="selectAllCats()">All</button><button class="btn-ghost btn-sm" onclick="selectNoCats()">None</button></div></div>
<div class="cat-grid" id="cat-grid"></div>
<div class="actions">
<button class="btn btn-primary btn-full btn-lg" id="start-quiz-btn" onclick="openQuizModal()">Start Quiz</button>
<div class="actions-row"><button class="btn btn-secondary btn-full" onclick="showScreen('browse')">Browse Words</button><button class="btn btn-secondary btn-full" onclick="showScreen('add')">Add Words</button></div>
<div class="actions-row" style="margin-top:4px"><button class="btn btn-secondary btn-full" onclick="openStats()">📊 Stats</button><button class="btn btn-secondary btn-full" onclick="openSettings()">⚙️ Settings</button></div>
<div class="actions-row" style="margin-top:4px"><button class="btn btn-secondary btn-full btn-sm" onclick="exportData()">Export Data</button><button class="btn btn-secondary btn-full btn-sm" onclick="document.getElementById('import-file').click()">Import Data</button><input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"></div>
<button class="btn btn-ghost btn-full" style="font-size:13px;color:#6b7280;margin-top:4px" onclick="resetProgress()">Reset Progress</button>
</div></div>

<div id="screen-quiz" class="hidden">
<div class="quiz-top"><button class="back" onclick="showScreen('menu')">&#8592; Back</button><span class="stats" id="quiz-stats"></span><button class="info-btn" onclick="showQuizInfo()" title="How scoring works">ℹ</button></div>
<div class="progress-bar progress-bar-xs" style="margin-bottom:4px"><div class="progress-fill" id="quiz-progress-fill"></div></div>
<div id="quiz-card" class="quiz-card"></div>
</div>

<div id="screen-done" class="hidden done-screen"><div class="done-emoji">&#127881;</div><div class="done-title">Session Complete</div><p class="done-stat" id="done-stat"></p><p class="done-pct" id="done-pct"></p><div class="done-actions"><button class="btn btn-primary btn-full" onclick="startQuiz()">Go Again</button><button class="btn btn-ghost btn-full" onclick="showScreen('menu')">Back to Menu</button></div><div id="done-wrong"></div></div>

<div id="screen-add" class="hidden">
<button class="browse-back" onclick="showScreen('menu')">&#8592; Back</button>
<div class="screen-title">Add Custom Words</div>
<div class="add-form"><div><div class="field-label">Japanese (Kanji/Kana)</div><input class="input" id="add-japanese" placeholder="e.g. 食べる"></div><div><div class="field-label">Furigana (optional)</div><input class="input" id="add-furigana" placeholder="e.g. たべる"></div><div><div class="field-label">English (semicolon-separated)</div><input class="input" id="add-english" placeholder="e.g. eat; consume" onkeydown="if(event.key==='Enter')addWord()"></div><div style="display:flex;gap:8px"><button class="btn btn-primary" style="flex:1" onclick="addWord()">Add Word</button><button class="btn btn-secondary" style="flex:0 0 auto;font-size:13px" onclick="lookupJisho()" title="Look up on Jisho.org">🔍 Jisho</button></div><div class="add-msg hidden" id="add-msg"></div></div>
<div id="custom-list-section" class="hidden"><div class="section-label" style="margin-bottom:8px" id="custom-list-label"></div><div class="custom-list" id="custom-list"></div></div></div>

<div id="screen-browse" class="hidden">
<div class="browse-header"><button class="browse-back" onclick="showScreen('menu')">&#8592; Back</button><input class="input" id="browse-search" placeholder="Search words..." oninput="renderBrowse()" style="margin-bottom:8px;font-size:14px;padding:10px 14px"><div class="filter-row" id="browse-filters"></div><div class="cat-nav-mobile-wrap"><button class="btn btn-secondary btn-sm" id="cat-nav-toggle" onclick="toggleCatNav()" style="margin-bottom:4px">⋮ Categories ▾</button><div class="cat-nav cat-nav-mobile hidden" id="cat-nav-mobile"></div></div></div>
<div class="browse-body"><div class="cat-nav cat-nav-desktop" id="cat-nav-desktop"></div><div class="browse-main"><div id="browse-list"></div></div></div></div>

function getLifetimeStats(){try{return JSON.parse(localStorage.getItem(STORAGE.lifetimeStats)||'{"correct":0,"incorrect":0}')}catch{return{correct:0,incorrect:0}}}

function recordIncorrect(){const s=getLifetimeStats();s.incorrect++;saveLifetimeStats(s);logActivity('incorrect')}
function logActivity(type){
  try{
    const log=JSON.parse(localStorage.getItem(STORAGE.activityLog)||'{}');
    const d=today();
    if(!log[d])log[d]={correct:0,incorrect:0};
    if(type==='correct')log[d].correct++;
    else log[d].incorrect++;
    // Prune entries older than 90 days
    const cutoff=new Date(Date.now()-90*24*60*60*1000).toISOString().slice(0,10);
    Object.keys(log).forEach(k=>{if(k<cutoff)delete log[k]});
    localStorage.setItem(STORAGE.activityLog,JSON.stringify(log));
  }catch{}
}

let favLists=[];
function loadFavourites(){try{favLists=JSON.parse(localStorage.getItem(STORAGE.favourites)||'[]')}catch{favLists=[]}}
function saveFavourites(){localStorage.setItem(STORAGE.favourites,JSON.stringify(favLists))}
function createFavList(name){favLists.push({name,ids:[]});saveFavourites();return favLists.length-1}
function toggleFavInList(listIdx,wordId){
  const list=favLists[listIdx];if(!list)return;
  const idx=list.ids.indexOf(wordId);
  if(idx>=0)list.ids.splice(idx,1);else list.ids.push(wordId);
  // Auto-delete empty lists
  if(list.ids.length===0){selectedCats.delete('fav-'+listIdx);favLists.splice(listIdx,1)}
  saveFavourites();
}
function isInAnyList(wordId){return favLists.some(l=>l.ids.includes(wordId))}
function showFavModal(wordId){
  const existing=document.querySelector('.fav-modal');if(existing)existing.remove();
  const overlay=document.createElement('div');overlay.className='edit-overlay fav-modal';
  let h='<div class="edit-modal" style="max-width:340px"><div style="font-weight:600;margin-bottom:12px">Add to list</div>';
  favLists.forEach((l,i)=>{
    const inList=l.ids.includes(wordId);
    h+='<button class="btn btn-full '+(inList?'btn-primary':'btn-secondary')+'" style="margin-bottom:6px;font-size:13px" onclick="toggleFavInList('+i+',\''+wordId+'\');showFavModal(\''+wordId+'\')">'+escapeHTML(l.name)+(inList?' ✓':'')+'</button>';
  });
  h+='<div style="display:flex;gap:6px;margin-top:8px"><input class="input" id="new-list-name" placeholder="New list name..." style="flex:1;font-size:13px;padding:8px"><button class="btn btn-primary btn-sm" onclick="const n=document.getElementById(\'new-list-name\').value.trim();if(n){createFavList(n);toggleFavInList(favLists.length-1,\''+wordId+'\');showFavModal(\''+wordId+'\')}">Create</button></div>';
  h+='<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="this.closest(\'.fav-modal\').remove();renderBrowse()">Done</button></div>';
  overlay.innerHTML=h;document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay){overlay.remove();renderBrowse()}});
}
function deleteFavList(idx){
  const btn=event.target;
  if(btn.dataset.confirmDelete==='true'){
    selectedCats.delete('fav-'+idx);
    favLists.splice(idx,1);
    saveFavourites();
    renderBrowse();
  } else {
    btn.dataset.confirmDelete='true';
    btn.textContent='Tap to confirm';
    btn.style.borderColor='#f87171';
    btn.style.color='#fff';
    btn.style.background='#f8717133';
    setTimeout(()=>{btn.dataset.confirmDelete='';btn.textContent='Delete';btn.style.borderColor='#f8717133';btn.style.color='#f87171';btn.style.background='none'},3000);
  }
}
function removeFavFromList(idx,wordId){
  toggleFavInList(idx,wordId);
  renderBrowse();
}

// ============ CONJUGATION ENGINE ============
const CONJ_U_MAP={'う':'い','く':'き','ぐ':'ぎ','す':'し','つ':'ち','ぬ':'に','ぶ':'び','む':'み','る':'り'};
const CONJ_A_MAP={'う':'わ','く':'か','ぐ':'が','す':'さ','つ':'た','ぬ':'な','ぶ':'ば','む':'ま','る':'ら'};
const CONJ_E_MAP={'う':'え','く':'け','ぐ':'げ','す':'せ','つ':'て','ぬ':'ね','ぶ':'べ','む':'め','る':'れ'};
const CONJ_O_MAP={'う':'お','く':'こ','ぐ':'ご','す':'そ','つ':'と','ぬ':'の','ぶ':'ぼ','む':'も','る':'ろ'};
const CONJ_TE_MAP={'う':'って','く':'いて','ぐ':'いで','す':'して','つ':'って','ぬ':'んで','ぶ':'んで','む':'んで','る':'って'};
const CONJ_TA_MAP={'う':'った','く':'いた','ぐ':'いだ','す':'した','つ':'った','ぬ':'んだ','ぶ':'んだ','む':'んだ','る':'った'};

function conjugate(reading,group,form){
  if(group===3){
    if(reading.endsWith('する')){
      const stem=reading.slice(0,-2);
      const forms={masu:stem+'します',te:stem+'して',ta:stem+'した',nai:stem+'しない',
        potential:stem+'できる',passive:stem+'される',causative:stem+'させる',volitional:stem+'しよう'};
      return forms[form]||'';
    }
    if(reading==='くる'){
      return({masu:'きます',te:'きて',ta:'きた',nai:'こない',
        potential:'こられる',passive:'こられる',causative:'こさせる',volitional:'こよう'})[form]||'';
    }
  }
  if(group===2){
    const stem=reading.slice(0,-1);
    const forms={masu:stem+'ます',te:stem+'て',ta:stem+'た',nai:stem+'ない',
      potential:stem+'られる',passive:stem+'られる',causative:stem+'させる',volitional:stem+'よう'};
    return forms[form]||'';
  }
  const last=reading.slice(-1);const stem=reading.slice(0,-1);
  if(reading==='いく'&&(form==='te'||form==='ta'))return form==='te'?stem+'って':stem+'った';
  const forms={
    masu:stem+(CONJ_U_MAP[last]||'')+'ます',
    te:stem+(CONJ_TE_MAP[last]||''),
    ta:stem+(CONJ_TA_MAP[last]||''),
    nai:stem+(CONJ_A_MAP[last]||'')+'ない',
    potential:stem+(CONJ_E_MAP[last]||'')+'る',
    passive:stem+(CONJ_A_MAP[last]||'')+'れる',
    causative:stem+(CONJ_A_MAP[last]||'')+'せる',
    volitional:stem+(CONJ_O_MAP[last]||'')+'う'
  };
  return forms[form]||'';
}

// ============ SRS ============
let _srsCache=null;
function _loadSRS(){if(!_srsCache)try{_srsCache=JSON.parse(localStorage.getItem(STORAGE.srs)||"{}")}catch{_srsCache={}}return _srsCache}
function _saveSRS(){localStorage.setItem(STORAGE.srs,JSON.stringify(_srsCache||{}))}
function getSRS(id){const d=_loadSRS();return d[id]||{level:0,nextReview:0}}
function saveSRS(id,data){const d=_loadSRS();d[id]=data;_saveSRS()}
function resetSRSStorage(){_srsCache={};_saveSRS()}
function isDueForReview(id){const s=getSRS(id);return s.nextReview>0&&s.nextReview<=Date.now()}
function advanceSRS(id){
  const s=getSRS(id);const nextLevel=Math.min(s.level+1,SRS_INTERVALS.length-1);
  const ease=s.ease||1.0;
  const newEase=Math.min(ease+0.15,2.5);
  const interval=Math.round(SRS_INTERVALS[nextLevel]*newEase);
  const nextReview=Date.now()+(interval*24*60*60*1000);
  saveSRS(id,{level:nextLevel,nextReview,ease:newEase});
}

function starsHTML(totalStars){
  // 0-9 stars across 3 tiers of 3
  const tier=totalStars<3?0:totalStars<6?1:totalStars<9?2:2;
  const starsInTier=totalStars%3; // 0,1,2 within tier (9 shows as full tier 2)

function matchAnswer(inp,ans){
  const clean=s=>s.replace(/[\u00a0\u200b\u200c\u200d\ufeff\u202f\u2009\u2008\u2007\u2006\u2005\u2004\u2003\u2002\u2001]/g,' ').trim().toLowerCase().replace(/\s+/g,' ').replace(/[''`.,!?;:]+$/,'');
  const normalize=s=>{let c=clean(s);c=c.replace(/^to\s+/,'').replace(/^the\s+/,'').replace(/^a\s+/,'');return c};
  const c=clean(inp);
  const cn=normalize(inp);
  // Check each accepted answer
  return ans.some(a=>{
    const ac=clean(a);const an=normalize(a);
    // Exact match
    if(ac===c)return true;
    // Normalized match (stripped to/the/a)
    if(an===cn&&cn.length>0)return true;
    // Allow 1-character typo for answers 4+ chars (Levenshtein distance 1)
    if(ac.length>=4&&c.length>=3&&Math.abs(ac.length-c.length)<=1&&levenshtein(ac,c)<=1)return true;
    if(an.length>=4&&cn.length>=3&&Math.abs(an.length-cn.length)<=1&&levenshtein(an,cn)<=1)return true;
    return false;
  });
}
function levenshtein(a,b){
  const m=a.length,n=b.length;if(m===0)return n;if(n===0)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){let curr=[i];for(let j=1;j<=n;j++){curr[j]=a[i-1]===b[j-1]?prev[j-1]:1+Math.min(prev[j],curr[j-1],prev[j-1])}prev=curr}
  return prev[n];
}

// ============ QUIZ ============
function startQuiz(){
  let pool;
  const activeWords=getActiveWords();
  // Conjugation mode: filter to verbs only
  if(quizMode==='conjugation'){
    const verbPool=activeWords.filter(w=>w.vg);
    if(verbPool.length===0){alert('No verbs found in selected categories.');return}
    pool=verbPool;
  } else if(sessionLimit===-1){pool=getDueWords().filter(w=>selectedCats.size===0||selectedCats.has(w.cat));if(pool.length===0){alert('No words due for review in selected categories.');return}}
  else if(sessionLimit===-2){pool=getDifficultWords().filter(w=>selectedCats.size===0||selectedCats.has(w.cat));if(pool.length===0){alert('No difficult words yet. Words appear here after 3+ wrong answers.');return}}
  else{const needWork=activeWords.filter(w=>getStars(w.id)<9);pool=needWork.length>0?needWork:activeWords}

  // Sort: unseen first, then fewer stars, shuffle within groups
  const grouped={};
  pool.forEach(w=>{
    const s=getStars(w.id);
    const key=s===0&&getWrongCount(w.id)===0?'new':String(s);
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(w);
  });
  const order=['new','0','1','2'];
  const sorted=[];
  order.forEach(k=>{if(grouped[k])sorted.push(...shuffle(grouped[k]))});

  // Apply session limit (for finite modes, limit the initial pool)
  const initialPool=(sessionLimit>0)?sorted.slice(0,sessionLimit):
                    (sessionLimit===-3)?shuffle([...sorted]):sorted;

  // Reset session state
  sessionBuckets={};
  initialPool.forEach(w=>{sessionBuckets[w.id]={bucket:0,lastSeen:-99}});

  // Build initial queue - just the pool in order, re-queuing happens dynamically
  quizQueue=[...initialPool];
  quizIdx=0;quizAnswered=0;quizCorrect=0;quizFeedback=null;quizShowHint=false;quizLastInput="";currentStreak=0;sessionWrong=[];
  quizTotalUnique=new Set(initialPool.map(w=>w.id)).size;quizSeenIds=new Set();quizProgressMax=0;
  _previewedThisSession.clear();
  quizStartTime=Date.now();
  updateStreak();
  showScreen('quiz');renderQuiz();
}

// Insert a word back into the queue after the appropriate gap for its bucket level
function requeueWord(w){
  const b=sessionBuckets[w.id];
  if(!b)return;
  if(quizMode==='conjugation')delete w._conjForm; // new random form on requeue
  const gap=SESSION_GAPS[Math.min(b.bucket,SESSION_GAPS.length-1)];
  // Add some randomness: insert at gap ± 30%
  const jitter=Math.floor(gap*0.3);
  const insertAfter=gap+Math.floor(Math.random()*jitter*2)-jitter;
  const insertAt=Math.min(quizIdx+1+Math.max(1,insertAfter),quizQueue.length);
  quizQueue.splice(insertAt,0,w);
  b.lastSeen=quizIdx;
}

function startTimer(){
  if(!timedMode)return;
  timerLeft=TIMER_SECS;
  renderTimerBar();
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timerLeft--;
    renderTimerBar();
    if(timerLeft<=3)playTimerWarn();
    if(timerLeft<=0){clearInterval(timerInterval);timerInterval=null;timeUp()}
  },1000);
}

function timeUp(){
  const w=quizQueue[quizIdx];
  quizLastInput="(time up)";quizAnswered++;
  quizFeedback='wrong';playTimerOut();currentStreak=0;recordIncorrect();
  if(!sessionWrong.some(x=>x.id===w.id))sessionWrong.push(w);
  const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
  sb.bucket=0;
  requeueWord(w);
  const tuTier=Math.floor(getStars(w.id)/3)*3;progress[w.id]={stars:tuTier,wrongCount:(getWrongCount(w.id)+1)};saveProgress();
  failSRS(w.id);

}

function buildChoices(correct){
  const all=getAllWords();
  const pool=correct.cat==='custom'
    ? all.filter(w=>w.id!==correct.id&&!isCharMode(w))
    : all.filter(w=>w.id!==correct.id&&w.cat===correct.cat);
  const wrong=shuffle(pool).slice(0,3);
  // If not enough in category, pad with random from anywhere
  if(wrong.length<3){
    const extras=shuffle(all.filter(w=>w.id!==correct.id&&!wrong.find(x=>x.id===w.id)&&!isCharMode(w))).slice(0,3-wrong.length);
    wrong.push(...extras);
  }
  return shuffle([correct,...wrong]);
}

function submitChoice(chosenId,correctId){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  const w=quizQueue[quizIdx];
  quizLastInput=getAllWords().find(x=>x.id===chosenId)?.english[0]||'';
  quizAnswered++;
  const isCorrect=chosenId===correctId;
  if(isCorrect){
    quizCorrect++;quizFeedback='correct';_feedbackShownAt=Date.now();currentStreak++;recordCorrect();
    const wc=getWrongCount(w.id);
    const justPrev=_justPreviewed.has(w.id);
    if(justPrev)_justPreviewed.delete(w.id);
    const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
    if(!justPrev)sb.bucket=Math.min(sb.bucket+1,SESSION_GAPS.length);
    if(sb.bucket<SESSION_GAPS.length){requeueWord(w)}
    if(!justPrev&&sb.bucket>=SESSION_GAPS.length){
      const ns=Math.min(9,getStars(w.id)+1);
      progress[w.id]={stars:ns,wrongCount:ns>=9?0:wc};saveProgress();
      if(ns===9){advanceSRS(w.id);playThreeStars()}
      else if(ns===3||ns===6){playThreeStars()}
      else if(ns===1)playOneStar();
      else playCorrect();
    } else {
      progress[w.id]={stars:getStars(w.id),wrongCount:wc};saveProgress();
      playCorrect();
    }
    if(sessionLimit===-3&&sb.bucket>=SESSION_GAPS.length){sb.bucket=0;quizQueue.push(w)}
  } else {
    quizFeedback='wrong';_feedbackShownAt=Date.now();playWrong();currentStreak=0;recordIncorrect();
    if(!sessionWrong.some(x=>x.id===w.id))sessionWrong.push(w);
    _justPreviewed.delete(w.id);
    const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
    sb.bucket=0;
    requeueWord(w);
    const curTier2=Math.floor(getStars(w.id)/3)*3;
    progress[w.id]={stars:curTier2,wrongCount:getWrongCount(w.id)+1};saveProgress();
    failSRS(w.id);
  }
  // Highlight chosen button
  document.querySelectorAll('.choice-btn').forEach(b=>{
    const chosen=b.textContent.trim()===quizLastInput.trim();
    const correct=b.textContent.trim()===w.english[0].trim();
    if(correct)b.style.background='rgba(16,185,129,0.3)';
    else if(chosen&&!isCorrect)b.style.background='rgba(239,68,68,0.3)';
    b.disabled=true;
  });
  setTimeout(()=>{if(!document.getElementById("screen-quiz").classList.contains("hidden")){speakJapanese(w.japanese,w.furigana);renderQuiz()}},800);
}

function submitQuiz(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  const el=document.getElementById('quiz-input');if(!el)return;const val=el.value;if(!val.trim())return;
  quizLastInput=val;quizAnswered++;const w=quizQueue[quizIdx];
  const isCorrect=quizMode==='conjugation'
    ?(()=>{const reading=w.furigana||w.japanese;const correct=conjugate(reading,w.vg,w._conjForm);return matchAnswer(val,[correct])})()
    :quizMode==='reverse'
    ?matchAnswer(val,[w.japanese,w.furigana].filter(Boolean))
    :matchAnswer(val,w.english);
  if(isCorrect){
    quizCorrect++;quizFeedback='correct';_feedbackShownAt=Date.now();currentStreak++;recordCorrect();
    const wc=getWrongCount(w.id);
    const justPrev=_justPreviewed.has(w.id);
    if(justPrev)_justPreviewed.delete(w.id);
    // Advance session bucket
    const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
    if(!justPrev)sb.bucket=Math.min(sb.bucket+1,SESSION_GAPS.length);
    // If not yet graduated (bucket < SESSION_GAPS.length), re-queue
    if(sb.bucket<SESSION_GAPS.length){
      requeueWord(w);
    }
    // Award stars only when graduated from session (bucket reaches SESSION_GAPS.length) and not just-previewed
    if(!justPrev&&sb.bucket>=SESSION_GAPS.length){
      const ns=Math.min(9,getStars(w.id)+1);
      progress[w.id]={stars:ns,wrongCount:ns>=9?0:wc};saveProgress();
      if(ns===9){advanceSRS(w.id);playThreeStars()}
      else if(ns===3||ns===6){playThreeStars()} // tier upgrade
      else if(ns===1)playOneStar();
      else playCorrect();
    } else {
      progress[w.id]={stars:getStars(w.id),wrongCount:wc};saveProgress();
      playCorrect();
    }
    // Infinite mode: when graduated a tier, reset bucket to cycle again
    if(sessionLimit===-3&&sb.bucket>=SESSION_GAPS.length){
      sb.bucket=0;
      quizQueue.push(w);
    }
  } else {
    quizFeedback='wrong';_feedbackShownAt=Date.now();playWrong();currentStreak=0;recordIncorrect();
    if(!sessionWrong.some(x=>x.id===w.id))sessionWrong.push(w);
    _justPreviewed.delete(w.id);
    // Reset session bucket to 0 on wrong
    const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
    sb.bucket=0;
    requeueWord(w);
    // On wrong, drop back to start of current tier
    const curTier=Math.floor(getStars(w.id)/3)*3;
    progress[w.id]={stars:curTier,wrongCount:getWrongCount(w.id)+1};saveProgress();
    failSRS(w.id);
  }
  speakJapanese(w.japanese,w.furigana);renderQuiz();
}

function retryWrong(){
  const pool=[...sessionWrong];
  sessionBuckets={};sessionWrong=[];
  pool.forEach(w=>{sessionBuckets[w.id]={bucket:0,lastSeen:-99}});
  quizQueue=shuffle(pool);
  quizIdx=0;quizAnswered=0;quizCorrect=0;quizFeedback=null;quizShowHint=false;quizLastInput="";currentStreak=0;
  quizTotalUnique=new Set(pool.map(w=>w.id)).size;quizSeenIds=new Set();quizProgressMax=0;
  quizStartTime=Date.now();

function exportData(){playClick();let srsData={};try{srsData=JSON.parse(localStorage.getItem(STORAGE.srs)||'{}')}catch{}const data={progress,customWords,overrides:wordOverrides,srs:srsData,favourites:favLists};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;const d=new Date();const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');a.download='japanese-renshuu-'+ds+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url)}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);
  let mergeStats={progMerged:0,progNew:0,customAdded:0,customSkipped:0,overridesAdded:0};
  // Merge progress: keep higher stars, accumulate wrongCount
  if(data.progress&&typeof data.progress==='object'){
    Object.entries(data.progress).forEach(([id,imp])=>{
      const cur=progress[id];
      if(!cur){progress[id]=imp;mergeStats.progNew++}
      else{
        const keepStars=Math.max(cur.stars||0,imp.stars||0);
        const keepWrong=Math.max(cur.wrongCount||0,imp.wrongCount||0);
        progress[id]={stars:keepStars,wrongCount:keepWrong};
        mergeStats.progMerged++;
      }
    });
    saveProgress();
  }
  // Merge customWords: skip duplicates by japanese+furigana match
  if(data.customWords&&Array.isArray(data.customWords)){
    const allExisting=getAllWords();
    data.customWords.forEach(w=>{
      const isDupe=allExisting.some(ex=>ex.japanese===w.japanese&&(ex.furigana||'')===(w.furigana||''));
      if(!isDupe){
        // Ensure unique id and category
        if(!w.cat)w.cat='custom';
        if(customWords.some(c=>c.id===w.id))w.id='custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
        customWords.push(w);mergeStats.customAdded++;
      } else {mergeStats.customSkipped++}
    });
    saveCustom();
  }
  // Merge overrides: imported values win for new keys, keep existing for conflicts
  if(data.overrides&&typeof data.overrides==='object'){
    Object.entries(data.overrides).forEach(([id,val])=>{
      if(!wordOverrides[id]){wordOverrides[id]=val;mergeStats.overridesAdded++}
    });
    saveOverrides();
  }
  // Merge SRS data: keep the further-out review date
  if(data.srs&&typeof data.srs==='object'){
    try{const curSRS=JSON.parse(localStorage.getItem(STORAGE.srs)||'{}');
    Object.entries(data.srs).forEach(([id,imp])=>{
      const cur=curSRS[id];
      if(!cur||imp.nextReview>cur.nextReview){curSRS[id]=imp}
    });
    localStorage.setItem(STORAGE.srs,JSON.stringify(curSRS));_srsCache=curSRS}catch{}
  }
  // Merge favourites
  if(data.favourites&&Array.isArray(data.favourites)){
    data.favourites.forEach(imp=>{
      const existing=favLists.find(l=>l.name===imp.name);
      if(existing){imp.ids.forEach(id=>{if(!existing.ids.includes(id))existing.ids.push(id)})}
      else{favLists.push(imp)}
    });
    saveFavourites();
  }
  renderMenu();
  const s=mergeStats;
  alert('Import merged!\n\nProgress: '+s.progNew+' new, '+s.progMerged+' updated\nCustom words: '+s.customAdded+' added, '+s.customSkipped+' duplicates skipped'+(s.overridesAdded?'\nOverrides: '+s.overridesAdded+' added':''));
}catch{alert('Invalid file.')}event.target.value=''};reader.readAsText(file)}

            <span style="color:#22d3ee">💎 Mastered (9 stars)</span><span style="font-weight:700;color:#f3f4f6">${mastered}</span>
          </div>
          <div style="border-top:1px solid #1f2937;padding-top:6px;margin-top:2px;display:flex;justify-content:space-between;align-items:center">
            <span style="color:#9ca3af">Total words encountered</span><span style="font-weight:700;color:#f3f4f6">${newLearnt} / ${all.length}</span>
          </div>
        </div>
      </div>
      <div style="background:#0f172a;border-radius:10px;padding:12px 14px">
        <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Lifetime Answers</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between"><span style="color:#34d399">✓ Correct</span><span style="font-weight:700;color:#f3f4f6">${ls.correct.toLocaleString()}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:#f87171">✗ Incorrect</span><span style="font-weight:700;color:#f3f4f6">${ls.incorrect.toLocaleString()}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:#9ca3af">Accuracy</span><span style="font-weight:700;color:#f3f4f6">${acc}%</span></div>
        </div>
      </div>
      <div style="background:#0f172a;border-radius:10px;padding:12px 14px">
        <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Activity (last 13 weeks)</div>
        <div id="stats-heatmap" style="overflow-x:auto"></div>
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-secondary btn-full" onclick="this.closest('.edit-overlay').remove()">Close</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  renderHeatmap();
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
}
function renderHeatmap(){
  const el=document.getElementById('stats-heatmap');if(!el)return;
  const log=getActivityLog();
  const now=new Date();
  // Build 91 days (13 weeks) ending today
  const days=[];
  for(let i=90;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const entry=log[key];
    const total=entry?(entry.correct+entry.incorrect):0;
    days.push({key,total,dow:d.getDay()});
  }
  const maxAct=Math.max(1,...days.map(d=>d.total));
  function cellColor(total){
    if(total===0)return'#111827';
    const pct=total/maxAct;
    if(pct<0.25)return'rgba(239,68,68,0.2)';
    if(pct<0.5)return'rgba(239,68,68,0.4)';
    if(pct<0.75)return'rgba(239,68,68,0.6)';
    return'rgba(239,68,68,0.85)';
  }
  // Pad start so first column starts on Monday
  const padded=[];
  const firstDow=days[0].dow;
  const mondayOffset=firstDow===0?6:firstDow-1;
  for(let i=0;i<mondayOffset;i++)padded.push(null);
  padded.push(...days);
  const cols=Math.ceil(padded.length/7);
  const labels=['M','','W','','F','','S'];
  let h='<div style="display:flex;gap:2px;align-items:flex-start"><div style="display:flex;flex-direction:column;gap:2px;padding-right:4px">';
  labels.forEach(l=>{h+='<div style="width:12px;height:12px;font-size:9px;color:#4b5563;display:flex;align-items:center">'+l+'</div>'});
  h+='</div><div style="display:flex;gap:2px">';
  for(let c=0;c<cols;c++){
    h+='<div style="display:flex;flex-direction:column;gap:2px">';
    for(let r=0;r<7;r++){
      const idx=c*7+r;
      const day=padded[idx];
      if(!day){h+='<div style="width:12px;height:12px"></div>';continue}
      const bg=cellColor(day.total);
      const title=day.key+': '+(day.total>0?day.total+' answers':'no activity');
      h+='<div title="'+title+'" style="width:12px;height:12px;border-radius:2px;background:'+bg+';cursor:default"></div>';
    }
    h+='</div>';
  }
  h+='</div></div>';
  h+='<div style="display:flex;align-items:center;gap:4px;margin-top:8px;font-size:10px;color:#4b5563">Less ';
  ['#111827','rgba(239,68,68,0.2)','rgba(239,68,68,0.4)','rgba(239,68,68,0.6)','rgba(239,68,68,0.85)'].forEach(c=>{
    h+='<div style="width:12px;height:12px;border-radius:2px;background:'+c+'"></div>';
  });
  h+=' More</div>';
  el.innerHTML=h;
}
