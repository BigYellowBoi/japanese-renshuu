<style>
/* Axiom look: midnight purple ground, surfaces mixed from a tint, purple accent. */
:root{
  --ground:#0b0812;--tint:#b8a6ff;
  --surface:color-mix(in srgb,var(--ground) 93%,var(--tint));
  --surface-top:color-mix(in srgb,var(--ground) 90.5%,var(--tint));
  --raised:color-mix(in srgb,var(--ground) 88%,var(--tint));
  --line:color-mix(in srgb,var(--ground) 80%,var(--tint));
  --line-soft:color-mix(in srgb,var(--ground) 89%,var(--tint));
  --input:color-mix(in srgb,var(--ground) 96%,var(--tint));
  --border:color-mix(in srgb,var(--ground) 76%,var(--tint));
  --btn-line:color-mix(in srgb,var(--ground) 81%,var(--tint));
  --hover:color-mix(in srgb,var(--ground) 85%,var(--tint));
  --seg-on:color-mix(in srgb,var(--ground) 84%,var(--tint));
  --dim:color-mix(in srgb,var(--ground) 58%,var(--tint));
  --text:#eeeaf6;--text-2:#c0b9d1;--label:#a49cba;
  --accent:#b294ff;--accent-2:#ff79d0;--on-accent:#0b0812;
  --accent-soft:color-mix(in srgb,var(--accent) 15%,transparent);
  --good:#3ee6c1;--warn:#ffb84d;--urgent:#ff6b7a;--info:#7cc4ff;
  /* Progress levels: learning, familiar, strong, mastered */
  --lv1:#ffd166;--lv2:#ff9f5a;--lv3:var(--accent);--lv4:var(--good);
  --bg:radial-gradient(1100px 620px at 12% -12%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),
       radial-gradient(900px 500px at 100% 0%,color-mix(in srgb,var(--accent-2) 8%,transparent),transparent 60%),var(--ground);
  --jp:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  --hdrdrop:0px;
  color-scheme:dark;
}
/* iOS blurs a band about 14pt below the status bar in home-screen apps (Axiom CLAUDE.md, iOS notes):
   drop the content 14pt and keep a solid strip over the status bar and the band, so nothing scrolls into the blur. */
@media (display-mode:standalone){html:root{--hdrdrop:14px}}
html.standalone:root{--hdrdrop:14px}
body::after{content:'';position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + var(--hdrdrop));background:var(--ground);z-index:60;pointer-events:none}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--tint) 22%,transparent);border-radius:999px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--tint) 30%,transparent) transparent}}
html,body{background:var(--ground);color:var(--text);overscroll-behavior:none}
/* As in Axiom: the page never scrolls; one fixed box does, so iOS gives it the rubber-band bounce at both ends. */
#scroller{position:fixed;inset:0;z-index:1;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{min-height:100vh;font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:var(--bg);z-index:0;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.jp{font-family:var(--jp)}
.mono{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:calc(100% + 1px);display:flex;flex-direction:column;gap:16px;
  padding:calc(16px + env(safe-area-inset-top) + var(--hdrdrop)) 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:768px){.app{max-width:960px;padding:32px 32px 48px}}

/* Page head */
.head{display:flex;align-items:center;gap:12px}
.head .grow{flex:1;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--jp);font-weight:700;font-size:20px;flex:none;box-shadow:0 0 22px color-mix(in srgb,var(--accent) 35%,transparent)}
/* Hinomaru in Axiom colours: a 3:2 light flag with the accent disc. */
.flag{width:48px;height:32px;border-radius:7px;background:var(--text);display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px var(--line),0 0 22px color-mix(in srgb,var(--accent) 30%,transparent)}
.flag i{width:19px;height:19px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h1 .jp{font-weight:700}
@media(min-width:768px){h1{font-size:30px}}
h2{font-size:15px;font-weight:600}
h3{font-size:17px;font-weight:600}
.sub{font-size:12px;color:var(--label)}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:600}

/* Surfaces */
.card{background:linear-gradient(180deg,var(--surface-top) 0%,var(--surface) 60%);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:inset 0 1px 0 #ffffff0d,0 10px 30px #00000055}
.card-head{display:flex;align-items:center;gap:10px;min-height:24px;flex-wrap:wrap}
.card-head .right{margin-left:auto}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.inset{background:var(--input);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

/* Buttons */
.btn{font-size:14px;color:var(--text);background:var(--raised);border:1px solid var(--btn-line);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,white)}
.btn.danger{color:var(--urgent);border-color:color-mix(in srgb,var(--urgent) 40%,transparent)}
.btn.danger.armed{background:color-mix(in srgb,var(--urgent) 18%,var(--ground));color:var(--text)}
.btn.small{min-height:32px;padding:5px 10px;font-size:12.5px}
.btn.big{min-height:52px;font-size:16px}
.btn.full{width:100%}
.btn.sq{width:42px;padding:0;flex:none}
.btn.small.sq{width:32px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--label)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.btn.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--text)}
.btn svg{width:18px;height:18px;flex:none}
.btn.small svg{width:15px;height:15px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.iconbtn{background:none;border:0;color:var(--label);cursor:pointer;width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{color:var(--text);background:var(--raised)}
.iconbtn svg{width:17px;height:17px}
.iconbtn.fav{color:var(--accent-2)}

/* Segments and chips */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--input);border:1px solid var(--line);border-radius:11px;flex-wrap:wrap}
.seg button{border:0;border-radius:8px;padding:7px 12px;min-height:34px;background:transparent;color:var(--label);cursor:pointer;font-size:13px}
.seg button[aria-pressed='true']{background:var(--seg-on);color:var(--text)}
.seg.full{display:grid;grid-template-columns:repeat(var(--n,2),1fr)}
.chip{font-size:12.5px;border-radius:999px;padding:5px 11px;background:var(--raised);border:1px solid var(--line);color:var(--text-2);white-space:nowrap;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed='true']{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--text)}
.chip .n{color:var(--label);font-variant-numeric:tabular-nums}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill.good{background:color-mix(in srgb,var(--good) 13%,var(--ground));color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--ground));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--urgent) 18%,var(--ground));color:var(--urgent)}
.pill.idle{background:var(--raised);color:var(--text-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:11px;color:var(--label);background:var(--raised);border-radius:5px;padding:1px 6px;white-space:nowrap}

/* Inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-size:12px;color:var(--label);font-weight:500}
.input{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:9px 12px;min-height:44px;width:100%;color:var(--text);font-size:16px;outline:none}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--dim)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;min-height:40px}
.switch input{width:20px;height:20px;accent-color:var(--accent);flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.msg{font-size:13px}.msg.error{color:var(--urgent)}.msg.success{color:var(--good)}

/* Progress */
.bar{height:6px;border-radius:999px;background:var(--raised);overflow:hidden}
.bar.thin{height:4px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s}

/* Menu */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:768px){.tiles{grid-template-columns:repeat(5,1fr);gap:8px}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--input);border:1px solid var(--line-soft);border-radius:10px;padding:7px 8px;cursor:pointer;color:var(--text);min-width:0;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--line)}
.tile .top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:4px}
.tile .gl{height:24px;min-width:24px;padding:0 4px;border-radius:6px;background:var(--raised);display:grid;place-items:center;font-family:var(--jp);font-weight:700;font-size:12px;color:var(--text-2);letter-spacing:-.04em}
.tile .gl svg{width:12px;height:12px}
.tile .gl.pic{width:24px;height:24px;padding:0;background:var(--accent-soft);color:var(--accent)}
.tile .gl.pic svg{width:15px;height:15px}
.tile .nm{font-size:12.5px;font-weight:500;line-height:1.2;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ct{font-size:11px;color:var(--label);font-variant-numeric:tabular-nums}
.tile[aria-pressed='true']{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.tile[aria-pressed='true'] .gl{background:var(--accent);color:var(--on-accent)}
.tile .minibar{height:2px;border-radius:999px;background:var(--raised);width:100%;overflow:hidden}
.tile .minibar i{display:block;height:100%;background:var(--accent)}
/* Start bar stays on screen while the categories scroll. */
.startbar{position:sticky;bottom:0;z-index:4;display:flex;flex-direction:column;gap:8px;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--ground) 28%)}
@media(min-width:768px){.startbar{margin:0;padding:12px 0 16px}}

/* Overlay sheet */
.overlay{position:fixed;inset:0;background:#05030acc;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;padding-top:calc(16px + env(safe-area-inset-top) + var(--hdrdrop))}
.sheet{width:100%;max-width:400px;max-height:calc(100vh - 32px - env(safe-area-inset-top) - var(--hdrdrop));overflow-y:auto;background:linear-gradient(180deg,var(--surface-top),var(--surface) 60%);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px #000a}
.sheet.center{text-align:center;align-items:center}
.sheet .big-glyph{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--jp);font-size:30px;font-weight:700}
.sheet p{color:var(--text-2);font-size:13.5px;line-height:1.55}
.legend{display:flex;flex-direction:column;gap:10px}
.legend b{display:block;color:var(--text);font-weight:600;margin-bottom:1px}

/* Stars: three pips in the colour of the current level */
.pips{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--raised);border:1px solid var(--line)}
.pips i.on{border-color:transparent;background:var(--c)}
.lv1{--c:var(--lv1)}.lv2{--c:var(--lv2)}.lv3{--c:var(--lv3)}.lv4{--c:var(--lv4)}
.lvdot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}

/* Quiz */
/* Phone: card sits at the top so the keyboard never covers it. Desktop: centred. */
@media(min-width:768px){#screen-quiz{min-height:calc(100vh - 80px);justify-content:center;max-width:600px;width:100%;margin:0 auto}}
.qtop{display:flex;align-items:center;gap:8px}
.qtop .grow{flex:1;text-align:center;font-size:12.5px;color:var(--label);font-variant-numeric:tabular-nums}
.qcard{text-align:center;align-items:center;gap:6px;padding:16px 18px;transition:border-color .25s,box-shadow .25s}
@media(min-height:700px){.qcard{padding:22px 22px}}
.qcard.correct{border-color:color-mix(in srgb,var(--good) 55%,transparent);box-shadow:inset 0 1px 0 #ffffff0d,0 0 30px color-mix(in srgb,var(--good) 14%,transparent)}
.qcard.tierup{border-color:color-mix(in srgb,var(--lv1) 55%,transparent);box-shadow:inset 0 1px 0 #ffffff0d,0 0 30px color-mix(in srgb,var(--lv1) 14%,transparent)}
.qcard.mastered{border-color:color-mix(in srgb,var(--good) 70%,transparent);box-shadow:inset 0 1px 0 #ffffff0d,0 0 40px color-mix(in srgb,var(--good) 22%,transparent)}
.qcard.wrong{border-color:color-mix(in srgb,var(--urgent) 55%,transparent);box-shadow:inset 0 1px 0 #ffffff0d,0 0 30px color-mix(in srgb,var(--urgent) 14%,transparent)}
.qmeta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--label)}
.qmeta .dots{display:inline-flex;gap:3px}
.qmeta .dots i{width:6px;height:6px;border-radius:50%;background:var(--raised)}
.qmeta .dots i.on{background:var(--good)}
.qfuri{min-height:24px;color:var(--accent);font-family:var(--jp);font-size:17px}
.qword{font-family:var(--jp);font-size:40px;font-weight:700;line-height:1.15;letter-spacing:.01em;word-break:break-word}
.qword.kana{font-size:64px}
.qword.en{font-family:inherit;font-size:30px}
.qword .target{display:block;font-family:'Geist',system-ui,sans-serif;font-size:14px;font-weight:600;color:var(--warn);margin-top:8px}
.qword svg{width:48px;height:48px;color:var(--accent)}
.qhint{min-height:18px;font-size:13px;color:var(--label)}
.qhint.jp{font-size:18px;color:var(--text-2)}
.fb{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.fb .verdict{font-size:19px;font-weight:700}
.fb .verdict.good{color:var(--good)}.fb .verdict.bad{color:var(--urgent)}.fb .verdict.up{color:var(--lv1)}
.fb .ans{color:var(--text-2);font-size:14px}
.fb .ans b{color:var(--text);font-weight:600}
.fb .typed{color:var(--label);font-size:12px}
.note{width:100%;text-align:left;font-size:13px;color:var(--text-2);background:color-mix(in srgb,var(--info) 8%,transparent);border:1px solid color-mix(in srgb,var(--info) 22%,transparent);border-radius:10px;padding:8px 12px}
.newword{width:100%;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:10px 14px}
.newword .eyebrow{margin-bottom:2px}
.newword .mean{font-size:20px;font-weight:600}
.qinput{width:100%;display:flex;flex-direction:column;gap:8px}
.qinput .row .input{flex:1}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.choices .btn{min-height:52px;white-space:normal;line-height:1.25}
.choices .btn.right{background:color-mix(in srgb,var(--good) 20%,var(--ground));border-color:var(--good)}
.choices .btn.miss{background:color-mix(in srgb,var(--urgent) 20%,var(--ground));border-color:var(--urgent)}
.timer{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--c,var(--good))}
.timer .bar{flex:1}.timer .bar>i{background:var(--c,var(--good));transition:width .9s linear}

/* Done */
.done{align-items:center;text-align:center}
.done .score{font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.done .stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* Lists (browse, custom, wrong words) */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line-soft);min-width:0}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.item .w{font-family:var(--jp);font-weight:500;font-size:15px}
.item .r{font-family:var(--jp);font-size:12px;color:var(--label)}
.item .m{color:var(--text-2);font-size:13px}
.item .acts{display:flex;align-items:center;gap:2px;flex:none}
.item .warnmark{color:var(--urgent);font-size:11px}
.item .edited{color:var(--warn);font-size:11px}

/* Browse */
.bhead{position:sticky;top:calc(env(safe-area-inset-top) + var(--hdrdrop));z-index:5;display:flex;flex-direction:column;gap:10px;padding:8px 0 10px;margin-top:-8px;background:linear-gradient(180deg,var(--ground) 80%,transparent)}
.bbody{display:flex;flex-direction:column;gap:16px}
.bnav{display:none}
.group-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);scroll-margin-top:200px;padding:4px 0}
.group-label .gl{width:24px;height:24px;border-radius:7px;background:var(--raised);display:grid;place-items:center;font-family:var(--jp);font-size:11px;font-weight:700;color:var(--text-2);letter-spacing:-.04em}
.group-label .gl.pic{background:var(--accent-soft);color:var(--accent)}
.group-label .gl svg{width:14px;height:14px}
.group-label .n{color:var(--label);font-weight:400}
/* Off-screen Browse cards skip layout and paint until scrolled near (about 1,300 rows in all). */
#browse-list>.card{content-visibility:auto;contain-intrinsic-size:auto 900px}
.group-label .right{margin-left:auto}
.mnav{display:flex;flex-direction:column;gap:6px}
@media(min-width:768px){
  .bbody{flex-direction:row;align-items:flex-start;gap:20px}
  .bnav{display:flex;flex-direction:column;gap:2px;flex:0 0 200px;position:sticky;top:120px;max-height:calc(100vh - 140px);overflow-y:auto}
  .bnav button{text-align:left;background:none;border:0;color:var(--label);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:6px}
  .bnav button:hover{background:var(--raised);color:var(--text)}
  .bnav button .n{margin-left:auto;font-variant-numeric:tabular-nums}
  .bmain{flex:1;min-width:0}
  .mnav{display:none}
  .group-label{scroll-margin-top:180px}
}

/* Stats heatmap */
.heat{display:flex;gap:3px;overflow-x:auto}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--raised);display:block}
.heat .lab{width:12px;height:12px;font-size:9px;color:var(--label);display:flex;align-items:center}
.heat-key{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--label)}
.heat-key i{width:12px;height:12px;border-radius:3px;display:block}
.statrow{display:flex;align-items:center;gap:8px;font-size:14px}
.statrow .v{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="scroller"><div class="app" id="app">

<div id="screen-menu" class="stack" style="gap:16px">
  <div class="head">
    <div class="flag" role="img" aria-label="Japanese flag"><i></i></div>
    <div class="grow"><h1><span class="jp">日本語練習</span></h1><div class="sub" id="menu-mastered-text"></div></div>
    <button class="btn ghost sq" onclick="openStats()" title="Stats" aria-label="Stats" data-ico="chart"></button>
    <button class="btn ghost sq" onclick="openSettings()" title="Settings" aria-label="Settings" data-ico="gear"></button>
  </div>
  <div class="bar"><i id="menu-progress-fill"></i></div>
  <div class="row wrap" id="streak-bar"></div>
  <div class="card">
    <div class="card-head"><h2>Categories</h2><div class="right chiprow" id="group-chips"></div></div>
    <div class="tiles" id="cat-grid"></div>
  </div>
  <div class="startbar">
    <button class="btn primary big full" id="start-quiz-btn" onclick="openQuizModal()">Start quiz</button>
    <div class="grid2"><button class="btn full" onclick="showScreen('browse')" data-ico="list" data-label="Browse words"></button><button class="btn full" onclick="showScreen('add')" data-ico="plus" data-label="Add words"></button></div>
  </div>
</div>

<div id="screen-quiz" class="hidden stack" style="gap:10px">
  <div class="qtop"><button class="btn ghost small" onclick="showScreen('menu')" data-ico="back" data-label="Back"></button><span class="grow" id="quiz-stats"></span><button class="btn ghost small sq" onclick="showQuizInfo()" title="How scoring works" aria-label="How scoring works" data-ico="info"></button></div>
  <div class="bar thin"><i id="quiz-progress-fill"></i></div>
  <div id="quiz-card" class="card qcard"></div>
</div>

<div id="screen-done" class="hidden">
  <div class="card done">
    <div class="eyebrow">Session complete</div>
    <div class="score" id="done-stat"></div>
    <div class="stats" id="done-pct"></div>
    <div class="grid2" style="width:100%;max-width:360px"><button class="btn primary" onclick="startQuiz()">Go again</button><button class="btn" onclick="showScreen('menu')">Menu</button></div>
    <div id="done-wrong" style="width:100%;max-width:420px"></div>
  </div>
</div>

<div id="screen-add" class="hidden stack" style="gap:16px">
  <div class="head"><button class="btn ghost small" onclick="showScreen('menu')" data-ico="back" data-label="Back"></button></div>
  <div class="head"><div class="grow"><h1>Add words</h1><div class="sub">They join the Custom category.</div></div></div>
  <div class="card">
    <div class="field"><label for="add-japanese">Japanese (kanji or kana)</label><input class="input jp" id="add-japanese" placeholder="食べる"></div>
    <div class="field"><label for="add-furigana">Reading (optional)</label><input class="input jp" id="add-furigana" placeholder="たべる"></div>
    <div class="field"><label for="add-english">English, separate answers with ;</label><input class="input" id="add-english" placeholder="eat; to eat" onkeydown="if(event.key==='Enter')addWord()"></div>
    <div class="row"><button class="btn primary" style="flex:1" onclick="addWord()">Add word</button><button class="btn" onclick="lookupJisho()" title="Look up on Jisho.org" data-ico="search" data-label="Jisho"></button></div>
    <div class="msg hidden" id="add-msg"></div>
  </div>
  <div id="custom-list-section" class="card hidden"><div class="card-head"><h2 id="custom-list-label"></h2></div><div class="list" id="custom-list"></div></div>
</div>

<div id="screen-browse" class="hidden">
  <div class="bhead">
    <div class="row"><button class="btn ghost small" onclick="showScreen('menu')" data-ico="back" data-label="Back"></button><input class="input" id="browse-search" placeholder="Search Japanese, reading or English" oninput="renderBrowse()"></div>
    <div class="chiprow" id="browse-filters"></div>
    <div class="mnav"><button class="btn small" id="cat-nav-toggle" onclick="toggleCatNav()" style="align-self:flex-start">Jump to category</button><div class="chiprow hidden" id="cat-nav-mobile"></div></div>
  </div>
  <div class="bbody"><nav class="bnav" id="cat-nav-desktop"></nav><div class="bmain" id="browse-list"></div></div>
</div>

</div></div>
<input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
<script>
const CATEGORIES={hiragana:{name:"Hiragana",icon:"あ"},katakana:{name:"Katakana",icon:"ア"},hiragana_combo:{name:"Combos",icon:"きゃ"},katakana_combo:{name:"Combos",icon:"キャ"},greetings:{name:"Greetings",icon:"挨",pic:"hand-stop"},numbers:{name:"Numbers",icon:"数",pic:"abacus"},food:{name:"Food & drink",icon:"食",pic:"bowl-chopsticks"},shopping:{name:"Shopping",icon:"買",pic:"shopping-bag"},directions:{name:"Directions",icon:"道",pic:"compass"},transport:{name:"Transport",icon:"車",pic:"train"},accommodation:{name:"Lodging",icon:"宿",pic:"bed"},restaurant:{name:"Restaurant",icon:"店",pic:"tools-kitchen-2"},sightseeing:{name:"Sightseeing",icon:"観",pic:"torii"},time:{name:"Time & days",icon:"時",pic:"clock"},people:{name:"People",icon:"人",pic:"users"},adjectives:{name:"Adjectives",icon:"形",pic:"sparkles"},verbs:{name:"Verbs",icon:"動",pic:"run"},essentials:{name:"Essentials",icon:"要",pic:"first-aid-kit"},conversation:{name:"Conversation",icon:"話",pic:"messages"},slang:{name:"Slang",icon:"俗",pic:"flame"},jlpt_n5:{name:"JLPT N5",icon:"N5"},jlpt_n4:{name:"JLPT N4",icon:"N4"},jlpt_n3:{name:"JLPT N3",icon:"N3"},jlpt_n2:{name:"JLPT N2",icon:"N2"},jlpt_n1:{name:"JLPT N1",icon:"N1"},custom:{name:"Custom",icon:"自",pic:"pencil"}};

const OPT_IN_CATS=['hiragana_combo','katakana_combo'];
// Words merged into another entry: old id -> kept id (progress moves across on load).
const MERGED_IDS={'ve-938':'ve-410'};

const ICONS={

  'first-aid-kit':'<path d="M8 8v-2a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v2"/><path d="M4 10a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -8"/><path d="M10 14h4"/><path d="M12 12v4"/>',

function ico(n,fill){return '<svg viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>'}
function catGlyph(info){return info.pic?ico(info.pic):info.icon}
function hydrateIcons(root){(root||document).querySelectorAll('[data-ico]').forEach(el=>{el.innerHTML=ico(el.dataset.ico)+(el.dataset.label?'<span>'+el.dataset.label+'</span>':'');el.removeAttribute('data-ico')})}
// Tap-again confirm, as in Axiom: first tap arms the button, a second within 3 s acts.
function tapAgain(btn,label,fn){
  if(btn.dataset.armed==='1'){btn.dataset.armed='';btn.classList.remove('armed');fn();return}
  const orig=btn.innerHTML;btn.dataset.armed='1';btn.classList.add('armed');btn.textContent=label||'Tap again';
  setTimeout(()=>{if(btn.dataset.armed==='1'){btn.dataset.armed='';btn.classList.remove('armed');btn.innerHTML=orig}},3000);
}
function openSheet(html,opts){
  opts=opts||{};
  const overlay=document.createElement('div');overlay.className='overlay'+(opts.cls?' '+opts.cls:'');if(opts.id)overlay.id=opts.id;
  overlay.innerHTML='<div class="sheet'+(opts.center?' center':'')+'">'+html+'</div>';
  document.body.appendChild(overlay);hydrateIcons(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay){if(opts.onClose)opts.onClose();overlay.remove()}});
  return overlay;
}
function closeSheet(el){const o=el&&el.closest?el.closest('.overlay'):null;if(o)o.remove()}

// Carry progress, review schedule and list entries from merged duplicate ids to the kept entry.
function migrateMerged(){
  let changed=false;const srs=_loadSRS();
  for(const [old,keep] of Object.entries(MERGED_IDS)){
    if(progress[old]){const a=progress[old],b=progress[keep]||{stars:0,wrongCount:0};
      progress[keep]={stars:Math.max(a.stars||0,b.stars||0),wrongCount:Math.max(a.wrongCount||0,b.wrongCount||0)};delete progress[old];changed=true}
    if(srs[old]){if(!srs[keep]||(srs[old].nextReview||0)>(srs[keep].nextReview||0))srs[keep]=srs[old];delete srs[old];_saveSRS()}
    favLists.forEach(l=>{const i=l.ids.indexOf(old);if(i>=0){l.ids.splice(i,1);if(!l.ids.includes(keep))l.ids.push(keep);saveFavourites()}});
    if(wordOverrides[old]){if(!wordOverrides[keep])wordOverrides[keep]=wordOverrides[old];delete wordOverrides[old];saveOverrides()}
  }
  if(changed)saveProgress();
}

// ============ CONJUGATION ENGINE ============
const CONJ_U_MAP={'う':'い','く':'き','ぐ':'ぎ','す':'し','つ':'ち','ぬ':'に','ぶ':'び','む':'み','る':'り'};
const CONJ_A_MAP={'う':'わ','く':'か','ぐ':'が','す':'さ','つ':'た','ぬ':'な','ぶ':'ば','む':'ま','る':'ら'};
const CONJ_E_MAP={'う':'え','く':'け','ぐ':'げ','す':'せ','つ':'て','ぬ':'ね','ぶ':'べ','む':'め','る':'れ'};
const CONJ_O_MAP={'う':'お','く':'こ','ぐ':'ご','す':'そ','つ':'と','ぬ':'の','ぶ':'ぼ','む':'も','る':'ろ'};
const CONJ_TE_MAP={'う':'って','く':'いて','ぐ':'いで','す':'して','つ':'って','ぬ':'んで','ぶ':'んで','む':'んで','る':'って'};
const CONJ_TA_MAP={'う':'った','く':'いた','ぐ':'いだ','す':'した','つ':'った','ぬ':'んだ','ぶ':'んだ','む':'んだ','る':'った'};

function conjugate(reading,group,form){
  if(group===3){
    if(reading.endsWith('する')){
      const stem=reading.slice(0,-2);
      const forms={masu:stem+'します',te:stem+'して',ta:stem+'した',nai:stem+'しない',
        potential:stem+'できる',passive:stem+'される',causative:stem+'させる',volitional:stem+'しよう'};
      return forms[form]||'';
    }
    if(reading==='くる'){
      return({masu:'きます',te:'きて',ta:'きた',nai:'こない',
        potential:'こられる',passive:'こられる',causative:'こさせる',volitional:'こよう'})[form]||'';
    }
  }
  if(group===2){
    const stem=reading.slice(0,-1);
    const forms={masu:stem+'ます',te:stem+'て',ta:stem+'た',nai:stem+'ない',
      potential:stem+'られる',passive:stem+'られる',causative:stem+'させる',volitional:stem+'よう'};
    return forms[form]||'';
  }
  const last=reading.slice(-1);const stem=reading.slice(0,-1);
  if(reading==='いく'&&(form==='te'||form==='ta'))return form==='te'?stem+'って':stem+'った';
  // Honorific -aru verbs: ます form drops the r (いらっしゃいます, not いらっしゃります).
  if(form==='masu'&&ARU_VERBS.some(v=>reading.endsWith(v)))return stem+'います';
  const forms={
    masu:stem+(CONJ_U_MAP[last]||'')+'ます',
    te:stem+(CONJ_TE_MAP[last]||''),
    ta:stem+(CONJ_TA_MAP[last]||''),
    nai:stem+(CONJ_A_MAP[last]||'')+'ない',
    potential:stem+(CONJ_E_MAP[last]||'')+'る',
    passive:stem+(CONJ_A_MAP[last]||'')+'れる',
    causative:stem+(CONJ_A_MAP[last]||'')+'せる',
    volitional:stem+(CONJ_O_MAP[last]||'')+'う'
  };
  return forms[form]||'';
}

const ARU_VERBS=['いらっしゃる','おっしゃる','くださる','なさる','ござる'];
// Answers accepted for a conjugation: the kana form, plus the same form written with the word's kanji.
function conjAnswers(w,form){
  const reading=w.furigana||w.japanese;const kana=conjugate(reading,w.vg,form);if(!kana)return[];
  const out=[kana];const jp=w.japanese;
  if(jp!==reading){
    if(w.vg===3&&reading.endsWith('くる')&&jp.endsWith('来る')){out.push(jp.slice(0,-2)+'来'+kana.slice(reading.length-1))}
    else{let k=0;while(k<jp.length&&k<reading.length&&jp[jp.length-1-k]===reading[reading.length-1-k])k++;
      const rStem=reading.slice(0,reading.length-k);
      if(k>0&&kana.startsWith(rStem))out.push(jp.slice(0,jp.length-k)+kana.slice(rStem.length));}
  }
  return out;
}
const CONJ_FORMS_NORMAL=['masu','te','ta','nai'];
const CONJ_FORMS_HARD=['masu','te','ta','nai','potential','passive','causative','volitional'];
const CONJ_LABELS={masu:'ます form',te:'て form',ta:'た form',nai:'ない form',
  potential:'Potential',passive:'Passive',causative:'Causative',volitional:'Volitional'};
let conjDifficulty='normal';
const VG_NAMES={1:'Godan',2:'Ichidan',3:'Irregular'};
let _lastGain=false; // the last answer earned a star
let _lastNote=''; // line under the verdict: what the answer did to the review day

// ============ REVIEW SCHEDULE ============
// Every word with a star has a review day: {nextReview: ms at local midnight, ivl: days}.
// A star is earned by one right answer on or after that day; a new word earns its first star in-session.
let _srsCache=null;
function _loadSRS(){if(!_srsCache)try{_srsCache=JSON.parse(localStorage.getItem(STORAGE.srs)||"{}")}catch{_srsCache={}}return _srsCache}
function _saveSRS(){localStorage.setItem(STORAGE.srs,JSON.stringify(_srsCache||{}))}
function getSRS(id){const d=_loadSRS();return d[id]||{nextReview:0,ivl:0}}
function saveSRS(id,data){const d=_loadSRS();d[id]=data;_saveSRS()}
function resetSRSStorage(){_srsCache={};_saveSRS()}
function dayStart(offset){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()+(offset||0)).getTime()}
function isDueForReview(id){return getStars(id)>=1&&(getSRS(id).nextReview||0)<=Date.now()}
function scheduleReview(id,days){saveSRS(id,{nextReview:dayStart(days),ivl:days})}
function scheduleForStar(id,stars){scheduleReview(id,STAR_DAYS[Math.max(1,Math.min(9,stars))-1])}
function stretchMastered(id){
  const cur=Math.max(1,getSRS(id).ivl||STAR_DAYS[8]);
  const next=cur<STAR_DAYS[8]?Math.min(STAR_DAYS[8],Math.round(cur*2.5)):Math.round(cur*MASTERED_GROWTH);
  scheduleReview(id,Math.min(MAX_REVIEW_DAYS,next));
}
function getDueWords(){return getAllWords().filter(w=>isDueForReview(w.id))}
function sortDue(list){return list.sort((a,b)=>((getSRS(a.id).nextReview||0)-(getSRS(b.id).nextReview||0))||(getStars(a.id)-getStars(b.id)))}
function daysUntilReview(id){return Math.round(((getSRS(id).nextReview||0)-dayStart(0))/86400000)}
function getReviewSchedule(id){const d=daysUntilReview(id);return d<=0?'Due now':d===1?'Due tomorrow':'Due in '+d+' days'}
function nextReviewText(id){const d=daysUntilReview(id);return d<=0?'today':d===1?'tomorrow':'in '+d+' days'}
// Progress saved before every star had a review day: starred words become due today;
// Mastered words keep the date they already had.
function migrateSchedule(){
  const srs=_loadSRS();let changed=false;
  Object.keys(progress).forEach(id=>{
    const stars=(progress[id]&&progress[id].stars)||0;const e=srs[id];
    if(stars<1){if(e){delete srs[id];changed=true}return}
    if(e&&typeof e.ivl==='number')return;
    if(stars>=9&&e&&e.nextReview>0)srs[id]={nextReview:e.nextReview,ivl:Math.max(3,Math.round(OLD_SRS_INTERVALS[Math.min(e.level||1,5)]*(e.ease||1)))};
    else srs[id]={nextReview:dayStart(0),ivl:STAR_DAYS[Math.min(stars,9)-1]};
    changed=true;
  });
  if(changed)_saveSRS();
}

// ============ STREAK ============
function getStreak(){
  try{return JSON.parse(localStorage.getItem(STORAGE.streak)||'{"count":0,"lastDate":""}')}catch{return{count:0,lastDate:""}}
}
function updateStreak(){
  const d=new Date();const today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const s=getStreak();
  if(s.lastDate===today)return s;
  const yd=new Date(Date.now()-86400000);const yesterday=yd.getFullYear()+'-'+String(yd.getMonth()+1).padStart(2,'0')+'-'+String(yd.getDate()).padStart(2,'0');
  const newCount=s.lastDate===yesterday?s.count+1:1;
  const newS={count:newCount,lastDate:today};
  localStorage.setItem(STORAGE.streak,JSON.stringify(newS));
  return newS;

function starsHTML(totalStars){

  // 0-2 learning, 3-5 familiar, 6-8 strong, 9 mastered.
  const s=Math.max(0,Math.min(9,totalStars||0));

function matchAnswer(inp,ans){
  const clean=s=>s.replace(/[ ​‌‍﻿          　]/g,' ').trim().toLowerCase().replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/\s+/g,' ').replace(/[''`.,!?;:。、！？]+$/,'');
  const normalize=s=>{let c=clean(s);c=c.replace(/^to\s+/,'').replace(/^the\s+/,'').replace(/^a\s+/,'');return c};
  const latin=s=>/^[\x00-\x7f]*$/.test(s);
  const c=clean(inp);
  const cn=normalize(inp);
  const known=glossSet();
  return ans.some(a=>{
    const ac=clean(a);const an=normalize(a);
    if(ac===c)return true;
    if(an===cn&&cn.length>0)return true;
    // One-letter typo allowed for English and romaji only. In Japanese one kana is the whole answer (かいて vs かいで).
    if(!latin(ac))return false;
    // A near miss that is itself another word's meaning is a different answer, not a typo (here/there, right/eight).
    if(known.has(c)||known.has(cn))return false;
    if(ac.length>=4&&c.length>=3&&Math.abs(ac.length-c.length)<=1&&levenshtein(ac,c)<=1)return true;
    if(an.length>=4&&cn.length>=3&&Math.abs(an.length-cn.length)<=1&&levenshtein(an,cn)<=1)return true;
    return false;
  });
}
let _glossCache=null;
function glossSet(){
  if(!_glossCache){_glossCache=new Set();const k=x=>x.trim().toLowerCase().replace(/\s+/g,' ');
    getAllWords().forEach(w=>w.english.forEach(e=>{const g=k(e);_glossCache.add(g);_glossCache.add(g.replace(/^(to|the|a)\s+/,''))}))}
  return _glossCache;
}
function levenshtein(a,b){
  const m=a.length,n=b.length;if(m===0)return n;if(n===0)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){let curr=[i];for(let j=1;j<=n;j++){curr[j]=a[i-1]===b[j-1]?prev[j-1]:1+Math.min(prev[j],curr[j-1],prev[j-1])}prev=curr}
  return prev[n];
}

// ============ QUIZ ============
function startQuiz(){
  let sorted;
  const activeWords=getActiveWords();
  const isDue=w=>isDueForReview(w.id);
  if(quizMode==='conjugation'){
    sorted=shuffle(activeWords.filter(w=>w.vg));
    if(sorted.length===0){notice('No verbs here','Pick a category with verbs, such as Verbs or a JLPT level.');return}
  } else if(sessionLimit===-1){
    sorted=sortDue(activeWords.filter(isDue));
    if(sorted.length===0){notice('Nothing due for review');return}
  } else if(sessionLimit===-2){
    sorted=shuffle(activeWords.filter(w=>getWrongCount(w.id)>=3));
    if(sorted.length===0){notice('No difficult words yet','A word lands here after 3 wrong answers.');return}
  } else {
    // Due reviews first (longest overdue first), then words begun but not yet starred (longest unseen first),
    // then new words. Words not due yet come last; they still count, once a day.
    const due=sortDue(activeWords.filter(isDue));
    const begun=activeWords.filter(w=>getStars(w.id)===0&&(w.id in progress)).sort((x,y)=>(progress[x.id].seen||0)-(progress[y.id].seen||0));
    const fresh=shuffle(activeWords.filter(w=>!(w.id in progress)));
    const early=sortDue(activeWords.filter(w=>getStars(w.id)>=1&&!isDue(w)));
    sorted=sessionLimit===-3?[...due,...shuffle([...begun,...fresh,...early])]:[...due,...begun,...fresh,...early];
  }
  const initialPool=sessionLimit>0?sorted.slice(0,sessionLimit):sorted;

  sessionBuckets={};
  initialPool.forEach(w=>{sessionBuckets[w.id]={bucket:0,lastSeen:-99}});
  quizQueue=[...initialPool];
  quizIdx=0;quizAnswered=0;quizCorrect=0;quizFeedback=null;quizShowHint=false;quizLastInput="";currentStreak=0;sessionWrong=[];
  quizTotalUnique=new Set(initialPool.map(w=>w.id)).size;quizSeenIds=new Set();quizProgressMax=0;
  _previewedThisSession.clear();
  quizStartTime=Date.now();
  showScreen('quiz');renderQuiz();
}
// Insert a word back into the queue after the appropriate gap for its bucket level
function requeueWord(w){
  const b=sessionBuckets[w.id];
  if(!b)return;
  if(quizMode==='conjugation')delete w._conjForm; // new random form on requeue
  const gap=SESSION_GAPS[Math.min(b.bucket,SESSION_GAPS.length-1)];
  // Add some randomness: insert at gap ± 30%
  const jitter=Math.floor(gap*0.3);
  const insertAfter=gap+Math.floor(Math.random()*jitter*2)-jitter;
  const insertAt=Math.min(quizIdx+1+Math.max(1,insertAfter),quizQueue.length);
  quizQueue.splice(insertAt,0,w);
  b.lastSeen=quizIdx;
  return insertAt;
}

// One place decides what an answer does to the session count, the stars and the review day.
function gradeAnswer(w,isCorrect,timedOut){
  const practice=quizMode==='conjugation'; // conjugation drills never move stars or review days
  const full=SESSION_GAPS.length;
  const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
  const stars=getStars(w.id),wc=getWrongCount(w.id),due=isDueForReview(w.id);
  _lastGain=false;_lastNote='';quizAnswered++;_feedbackShownAt=Date.now();_undo=null;
  if(!isCorrect){
    // Kept so a typed slip can be taken back with "That was a typo" (not for Choice taps or time-outs).
    const snap={id:w.id,prog:progress[w.id]?{...progress[w.id]}:null,srs:_loadSRS()[w.id]?{..._loadSRS()[w.id]}:null,sb:{...sb},streak:currentStreak,
      newWrong:!sessionWrong.some(x=>x.id===w.id),prev:_justPreviewed.has(w.id)};
    quizFeedback='wrong';currentStreak=0;recordIncorrect();if(timedOut)playTimerOut();else playWrong();
    if(snap.newWrong)sessionWrong.push(w);
    _justPreviewed.delete(w.id);
    sb.bucket=0;sb.missed=true;snap.at=requeueWord(w);
    if(!timedOut&&quizMode!=='choice')_undo=snap;
    if(!practice){
      // Back to the start of the current level; a Mastered word falls to Strong. Due again tomorrow.
      const ns=stars>=9?6:Math.floor(stars/3)*3;
      setProg(w.id,ns,wc+1);
      if(ns>=1){scheduleReview(w.id,1);_lastNote=(ns<stars?'Back to '+levelName(ns).toLowerCase()+'. ':'')+'Due again tomorrow'}
    }
    return;
  }
  quizCorrect++;quizFeedback='correct';currentStreak++;recordCorrect();
  const justPrev=_justPreviewed.has(w.id);if(justPrev)_justPreviewed.delete(w.id);
  if(justPrev||quizShowHint){
    // Right after the new-word card, or with the reading shown: no credit, and no star for this word this session.
    if(quizShowHint){sb.missed=true;_lastNote='Reading shown, so this answer does not count'}
    if(!practice)setProg(w.id,stars,wc);
    requeueWord(w);playCorrect();return;
  }
  // New words, and words missed this session, need 3 spaced right answers; a review needs one.
  const learning=practice||stars===0||sb.missed;
  sb.bucket=learning?Math.min(sb.bucket+1,full):full;
  if(sb.bucket<full){requeueWord(w);if(!practice)setProg(w.id,stars,wc);playCorrect();return}
  let ns=stars;
  if(!practice){
    let credit=false;
    if(stars===0){ns=1;credit=true;scheduleForStar(w.id,1);_lastNote='Next review '+nextReviewText(w.id)}
    else if(sb.missed){_lastNote=isDueForReview(w.id)?'No star this time. It stays due':'Next review '+nextReviewText(w.id)}
    else if(creditedToday(w.id)){_lastNote='Already counted today. Next review '+nextReviewText(w.id)}
    else if(quizMode==='choice'&&stars>=CHOICE_STAR_CAP){_lastNote='Choice stops at '+CHOICE_STAR_CAP+' stars. Type the answer to move this word on'}
    else if(stars>=9){credit=true;stretchMastered(w.id);_lastNote='Next review '+nextReviewText(w.id)}
    else{ns=stars+1;credit=true;scheduleForStar(w.id,ns);_lastNote='Next review '+nextReviewText(w.id)}
    setProg(w.id,ns,ns>=9?0:wc,credit);
  }
  _lastGain=ns>stars;
  if(_lastGain&&(ns===9||ns===3||ns===6))playThreeStars();
  else if(_lastGain&&ns===1)playOneStar();
  else playCorrect();
  // Endless: the word goes round again as practice
  if(sessionLimit===-3){sb.bucket=0;sb.missed=false;quizQueue.push(w)}
}

function buildChoices(correct){
  const all=getAllWords();
  const key=s=>s.trim().toLowerCase();
  const mine=new Set(correct.english.map(key));
  // A distractor never shares a meaning with the answer, and no two choices show the same text.
  const ok=w=>w.id!==correct.id&&!w.english.some(e=>mine.has(key(e)));
  const pool=correct.cat==='custom'?all.filter(w=>ok(w)&&!isCharMode(w)):all.filter(w=>ok(w)&&w.cat===correct.cat);
  const wrong=[];const seen=new Set([key(correct.english[0])]);
  for(const w of shuffle(pool)){if(wrong.length>=3)break;const k=key(w.english[0]);if(!seen.has(k)){seen.add(k);wrong.push(w)}}
  if(wrong.length<3){
    for(const w of shuffle(all.filter(w=>ok(w)&&!isCharMode(w)))){if(wrong.length>=3)break;const k=key(w.english[0]);if(!seen.has(k)){seen.add(k);wrong.push(w)}}
  }
  return shuffle([correct,...wrong]);

function gotIt(){

function renderQuiz(){
  if(quizIdx>=quizQueue.length&&sessionLimit!==-3){showDone();return}
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  const w=quizQueue[quizIdx];
  const _hasProgress=w.id in progress;
  const _alreadyPreviewed=_previewedThisSession.has(w.id);
  if(showNewWordCard&&!quizFeedback&&!_hasProgress&&!_alreadyPreviewed&&quizMode!=='conjugation'){
    _previewedThisSession.add(w.id);
    renderPreview(w);
    return;
  }
  ensureCardInner();
  const stars=getStars(w.id);
  const modeLabel={normal:"JP to EN",reverse:"EN to JP",listen:"Listen",choice:"Choice",conjugation:"Conjugate"}[quizMode];
  quizHeader();
  const card=document.getElementById('quiz-card');
  const newStars=getStars(w.id);
  const cardClass=quizFeedback==='correct'?(_lastGain&&newStars>=9?' mastered':_lastGain&&(newStars===3||newStars===6)?' tierup':' correct'):quizFeedback==='wrong'?' wrong':'';
  card.className='card qcard'+cardClass;

  const sb=sessionBuckets[w.id];
  const sessionDots=sb&&sb.bucket>0&&sb.bucket<SESSION_GAPS.length?'<span>'+sb.bucket+' of '+SESSION_GAPS.length+' this session</span>':'';
  const srsInfo=stars>=1?'<span>'+getReviewSchedule(w.id)+'</span>':'';
  document.getElementById('quiz-stars-area').innerHTML=starsHTML(stars)+sessionDots+srsInfo;

  const catInfo=CATEGORIES[w.cat]||{name:w.cat};
  const posLabel=w.pos?' · '+w.pos:'';
  document.getElementById('quiz-cat').textContent=catInfo.name+posLabel+' · '+modeLabel;

  document.getElementById('quiz-hint-area').textContent=((quizShowHint||quizFeedback)&&w.furigana)?w.furigana:'';

  const jpEl=document.getElementById('quiz-japanese');
  const speakBtn=document.getElementById('quiz-speak-btn');
  const rd=document.getElementById('romaji-hint');
  rd.textContent='';rd.className='qhint';

  if(quizMode==='reverse'){
    jpEl.textContent=w.english[0];jpEl.className='qword en';
    if(speakBtn){speakBtn.style.display='none';speakBtn.onclick=speakCurrent;}
  } else if(quizMode==='conjugation'){
    if(!w._conjForm){
      const forms=conjDifficulty==='hard'?CONJ_FORMS_HARD:CONJ_FORMS_NORMAL;
      w._conjForm=forms[Math.floor(Math.random()*forms.length)];
    }
    jpEl.innerHTML=escapeHTML(w.japanese)+'<span class="target">to '+CONJ_LABELS[w._conjForm]+'</span>';
    jpEl.className='qword';
    if(speakBtn){speakBtn.style.display='';speakBtn.onclick=speakCurrent;}
    if(quizShowHint&&!quizFeedback){rd.textContent=VG_NAMES[w.vg]+' · '+(w.furigana||w.japanese);rd.className='qhint jp'}
  } else if(quizMode==='listen'){
    jpEl.innerHTML=ico('speaker');jpEl.className='qword';
    if(speakBtn){speakBtn.style.display='';speakBtn.onclick=()=>speakJapanese(w.japanese,w.furigana)}
    if(quizShowHint&&!quizFeedback){rd.textContent=(w.furigana||w.japanese);rd.className='qhint jp'}
    if(!quizFeedback&&!quizShowHint)setTimeout(()=>speakJapanese(w.japanese,w.furigana),200);
  } else {
    jpEl.textContent=w.japanese;jpEl.className='qword'+(isCharMode(w)?' kana':'');
    if(speakBtn){speakBtn.style.display='';speakBtn.onclick=speakCurrent;}
    if(isCharMode(w)&&quizShowHint&&!quizFeedback){rd.textContent='Reads as '+w.english[0]}
  }

  const hintBtnArea=document.getElementById('quiz-hint-btn-area');
  if((w.furigana||isCharMode(w)||quizMode==='listen'||quizMode==='conjugation')&&!quizShowHint&&!quizFeedback&&quizMode!=='reverse')hintBtnArea.innerHTML='<button class="btn small" onclick="showQuizHint()">Show reading</button>';
  else hintBtnArea.innerHTML='';

  const fbArea=document.getElementById('quiz-feedback-area');
  const wc=getWrongCount(w.id);
  const wrongSuffix=wc>0?'<div class="typed">Wrong '+wc+' time'+(wc>1?'s':'')+' in total</div>':'';
  const jpLine=quizMode==='reverse'?'<div class="ans jp">'+escapeHTML(w.japanese)+(w.furigana?' ('+escapeHTML(w.furigana)+')':'')+'</div>':'';
  const noteLine=_lastNote?'<div class="typed">'+escapeHTML(_lastNote)+'</div>':'';
  const conjLine=()=>'<div class="ans jp"><b>'+conjAnswers(w,w._conjForm).map(escapeHTML).join(' / ')+'</b></div>';
  if(quizFeedback==='correct'){
    const ns=getStars(w.id);
    let h=ns>=9&&_lastGain?'<div class="verdict good">Mastered</div>'
      :(ns===3||ns===6)&&_lastGain?'<div class="verdict up">Now '+levelName(ns).toLowerCase()+'</div>'
      :'<div class="verdict good">Correct</div>';
    if(quizMode==='conjugation')h+=conjLine();
    else if(w.english.length>1)h+='<div class="ans">'+escapeHTML(w.english.join(', '))+'</div>';
    h+=jpLine+noteLine+exampleHTML(w);fbArea.innerHTML=h}
  else if(quizFeedback==='wrong'){
    let h='<div class="verdict bad">Not quite</div>';
    if(quizMode==='conjugation')h+=conjLine();
    else h+='<div class="ans"><b>'+escapeHTML(w.english.join(', '))+'</b></div>';
    h+=jpLine+'<div class="typed">You answered '+escapeHTML(quizLastInput)+'</div>'+wrongSuffix+noteLine+(_undo&&_undo.id===w.id?'<button class="btn small" onclick="undoMiss()">That was a typo</button>':'')+exampleHTML(w);fbArea.innerHTML=h}
  else fbArea.innerHTML='';

  const inputArea=document.getElementById('quiz-input-area');
  if(!quizFeedback){
    if(quizMode==='choice'){
      const choices=buildChoices(w);
      inputArea.innerHTML='<div class="choices">'+choices.map(c=>'<button class="btn" data-id="'+c.id+'" onclick="submitChoice(\''+c.id+'\',\''+w.id+'\')">'+escapeHTML(c.english[0])+'</button>').join('')+'</div>';
    } else {
      const ph=isCharMode(w)?'Type the romaji':quizMode==='reverse'?'Type the Japanese':quizMode==='conjugation'?'Type the form in kana or kanji':'Type the English meaning';
      inputArea.innerHTML='<div id="timer-bar"></div><div class="row"><input class="input'+(quizMode==='reverse'||quizMode==='conjugation'?' jp':'')+'" id="quiz-input" placeholder="'+ph+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="quizKeydown(event)"><button class="btn primary" onclick="submitQuiz()">Check</button></div>';
      {const el=document.getElementById('quiz-input');if(el)el.focus();}
      if(timedMode)startTimer();
    }
  } else {
    inputArea.innerHTML='<button class="btn big full" onclick="nextQuiz()">Next '+ico('next')+'</button>';
  }
}
function submitChoice(chosenId,correctId){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  const w=quizQueue[quizIdx];
  quizLastInput=getAllWords().find(x=>x.id===chosenId)?.english[0]||'';
  const isCorrect=chosenId===correctId;
  gradeAnswer(w,isCorrect);
  // Highlight by word id (two words can share a meaning's text)
  document.querySelectorAll('.choices .btn').forEach(b=>{
    if(b.dataset.id===correctId)b.classList.add('right');
    else if(b.dataset.id===chosenId&&!isCorrect)b.classList.add('miss');
    b.disabled=true;
  });
  setTimeout(()=>{if(!document.getElementById("screen-quiz").classList.contains("hidden")){speakJapanese(w.japanese,w.furigana);renderQuiz()}},800);
}

function submitQuiz(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  const el=document.getElementById('quiz-input');if(!el)return;const val=el.value;if(!val.trim())return;
  quizLastInput=val;const w=quizQueue[quizIdx];
  const isCorrect=quizMode==='conjugation'
    ?matchAnswer(val,conjAnswers(w,w._conjForm))
    :quizMode==='reverse'
    ?matchAnswer(val,reverseAnswers(w))
    :quizMode==='listen'
    ?matchAnswer(val,listenAnswers(w))
    :matchAnswer(val,w.english);
  gradeAnswer(w,isCorrect);
  speakJapanese(w.japanese,w.furigana);renderQuiz();
}

function showQuizHint(){
  playClick();
  const el=document.getElementById('quiz-input');

  quizShowHint=true;
  renderQuiz();
  const restored=document.getElementById('quiz-input');

}
function nextQuiz(){
  playClick();_undo=null;
  quizFeedback=null;quizShowHint=false;quizLastInput="";quizIdx++;renderQuiz();
}
function quizKeydown(e){if(e.key==='Enter'){if(quizFeedback)nextQuiz();else submitQuiz()}}

let _feedbackShownAt=0;
let _previewShownAt=0;
document.addEventListener('keydown',function(e){
  const screen=document.getElementById('screen-quiz');
  if(!screen||screen.classList.contains('hidden'))return;
  // Enter: advance feedback/preview
  if(e.key==='Enter'){
    if(quizFeedback&&Date.now()-_feedbackShownAt>300){nextQuiz();return;}
    if(!quizFeedback&&_previewShownAt>0&&Date.now()-_previewShownAt>300){_previewShownAt=0;gotIt();return;}
    return;
  }
  // Space: play audio (prevent page scroll) — but not while typing in the answer box
  const tag=e.target&&e.target.tagName;
  if(e.key===' '&&!quizFeedback&&tag!=='INPUT'&&tag!=='TEXTAREA'){
    e.preventDefault();
    const w=quizQueue[quizIdx];if(w)speakJapanese(w.japanese,w.furigana);return;
  }
  // 1-4: multiple choice selection
  if(quizMode==='choice'&&!quizFeedback&&/^[1-4]$/.test(e.key)){
    const btns=document.querySelectorAll('.choices .btn');
    const idx=parseInt(e.key)-1;
    if(btns[idx])btns[idx].click();return;
  }
});
function showDone(){
  const elapsed=Math.round((Date.now()-quizStartTime)/1000);
  const mins=Math.floor(elapsed/60);const secs=elapsed%60;
  const timeStr=mins>0?mins+'m '+secs+'s':secs+'s';
  document.getElementById('done-stat').textContent=quizCorrect+' / '+quizAnswered;
  document.getElementById('done-pct').innerHTML=(quizAnswered>0?'<span class="pill accent">'+Math.round((quizCorrect/quizAnswered)*100)+'% correct</span>':'')+'<span class="pill idle">'+getStreak().count+' day streak</span><span class="pill idle">'+timeStr+'</span>';
  const wrongArea=document.getElementById('done-wrong');
  if(sessionWrong.length>0){
    let h='<div class="stack"><div class="spread"><h2>Missed this session</h2><span class="sub">'+sessionWrong.length+'</span></div><div class="list">';
    sessionWrong.forEach(w=>{
      h+='<div class="item"><div class="grow"><span class="w">'+escapeHTML(w.japanese)+'</span>'+(w.furigana?'<span class="r">'+escapeHTML(w.furigana)+'</span>':'')+'<span class="m">'+escapeHTML(w.english[0])+'</span></div><span class="tag">'+getWrongCount(w.id)+' wrong</span></div>';
    });
    h+='</div><button class="btn full" onclick="retryWrong()">Retry missed words</button></div>';
    wrongArea.innerHTML=h;
  } else wrongArea.innerHTML='<span class="pill good">No mistakes this session</span>';
  showScreen('done');
  checkMilestones();
}
function retryWrong(){
  const pool=[...sessionWrong];
  sessionBuckets={};sessionWrong=[];
  pool.forEach(w=>{sessionBuckets[w.id]={bucket:0,lastSeen:-99}});
  quizQueue=shuffle(pool);
  quizIdx=0;quizAnswered=0;quizCorrect=0;quizFeedback=null;quizShowHint=false;quizLastInput="";currentStreak=0;
  quizTotalUnique=new Set(pool.map(w=>w.id)).size;quizSeenIds=new Set();quizProgressMax=0;
  quizStartTime=Date.now();
  _previewedThisSession.clear();
  showScreen('quiz');renderQuiz();
}

// ============ MILESTONES ============
function getSeenMilestones(){try{return JSON.parse(localStorage.getItem(STORAGE.milestones)||'[]')}catch{return[]}}
function saveSeenMilestone(id){const seen=getSeenMilestones();if(!seen.includes(id)){seen.push(id);localStorage.setItem(STORAGE.milestones,JSON.stringify(seen))}}
function checkMilestones(){
  const seen=getSeenMilestones();
  const all=getAllWords();const mastered=all.filter(w=>getStars(w.id)>=9).length;
  const streak=getStreak().count;
  const pct=quizAnswered>0?Math.round((quizCorrect/quizAnswered)*100):0;
  const milestones=[
    {id:'m50',test:mastered>=50,glyph:'50',title:'50 words mastered'},
    {id:'m100',test:mastered>=100,glyph:'百',title:'100 words mastered'},
    {id:'m250',test:mastered>=250,glyph:'250',title:'250 words mastered'},
    {id:'m500',test:mastered>=500,glyph:'500',title:'500 words mastered'},
    {id:'m1000',test:mastered>=1000,glyph:'千',title:'1,000 words mastered'},
    {id:'s7',test:streak>=7,glyph:'7',title:'7 day streak'},
    {id:'s30',test:streak>=30,glyph:'30',title:'30 day streak'},
    {id:'s100',test:streak>=100,glyph:'百',title:'100 day streak'},
    {id:'p100',test:pct===100&&quizAnswered>=10,glyph:'満',title:'Perfect session',sub:'Every answer right, 10 or more.'},
  ];
  for(const m of milestones){
    if(m.test&&!seen.includes(m.id)){saveSeenMilestone(m.id);showMilestoneModal(m);break}
  }
}
function showMilestoneModal(m){
  openSheet('<div class="big-glyph">'+m.glyph+'</div><h3>'+m.title+'</h3>'+(m.sub?'<p>'+m.sub+'</p>':'')+'<button class="btn primary full" onclick="closeSheet(this)">Nice</button>',{center:true});
}

  });
  favSections.forEach(({list,idx,words})=>{
    cards.push({n:words.length,html:()=>'<div class="card" style="margin-bottom:12px"><div class="group-label" id="browse-cat-fav-'+idx+'"><span class="gl">'+ico('heart',true)+'</span>'+escapeHTML(list.name)+' <span class="n">'+words.length+'</span><button class="btn small danger right" onclick="event.stopPropagation();deleteFavList('+idx+')">Delete list</button></div><div class="list">'+words.map(w=>wordRow(w,idx)).join('')+'</div></div>'});
  });
  paintBrowse(head,cards);
}
// Browse holds every word (about 1,300 rows, 27,000 elements): drawing them all at once froze the
// screen for a second or more on the phone. Draw the first screenful now, the rest a batch a frame.
let _browseGen=0,_browseFlush=()=>{};
function paintBrowse(head,cards){
  const gen=++_browseGen,list=document.getElementById('browse-list');let i=0;
  const step=budget=>{let html='',rows=0;while(i<cards.length&&rows<budget){html+=cards[i].html();rows+=cards[i].n;i++}if(html)list.insertAdjacentHTML('beforeend',html)};
  list.innerHTML=cards.length?head:'<div class="sub">No words match.</div>';
  step(40);
  _browseFlush=()=>{if(gen===_browseGen)step(Infinity)};
  const more=()=>{if(gen!==_browseGen||i>=cards.length)return;step(30);setTimeout(more,30)};
  requestAnimationFrame(()=>setTimeout(more,30));
}
function toggleCatNav(){

function scrollToBrowseCat(cat){
  const nav=document.getElementById('cat-nav-mobile');
  if(nav&&!nav.classList.contains('hidden'))nav.classList.add('hidden');
  let el=document.getElementById('browse-cat-'+cat);
  if(!el){_browseFlush();el=document.getElementById('browse-cat-'+cat)}
  if(!el)return;
  // Off-screen cards have estimated heights until drawn, so jump, let the cards near the target draw, and jump again until it holds.
  let n=0,last=null;const go=()=>{el.scrollIntoView({block:'start'});const t=Math.round(el.getBoundingClientRect().top);if(t!==last&&n++<12){last=t;requestAnimationFrame(go)}};go();
}

function exportData(){playClick();let srsData={};try{srsData=JSON.parse(localStorage.getItem(STORAGE.srs)||'{}')}catch{}const data={progress,customWords,overrides:wordOverrides,srs:srsData,favourites:favLists};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;const d=new Date();const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');a.download='japanese-renshuu-'+ds+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url)}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);
  let mergeStats={progMerged:0,progNew:0,customAdded:0,customSkipped:0,overridesAdded:0};
  // Merge progress: keep higher stars, accumulate wrongCount
  if(data.progress&&typeof data.progress==='object'){
    Object.entries(data.progress).forEach(([id,imp])=>{
      const cur=progress[id];
      if(!cur){progress[id]=imp;mergeStats.progNew++}
      else{
        const keepStars=Math.max(cur.stars||0,imp.stars||0);
        const keepWrong=Math.max(cur.wrongCount||0,imp.wrongCount||0);
        progress[id]={stars:keepStars,wrongCount:keepWrong,seen:Math.max(cur.seen||0,imp.seen||0)};
        mergeStats.progMerged++;
      }
    });
    saveProgress();
  }
  // Merge customWords: skip duplicates by japanese+furigana match
  if(data.customWords&&Array.isArray(data.customWords)){
    const allExisting=getAllWords();
    data.customWords.forEach(w=>{
      const isDupe=allExisting.some(ex=>ex.japanese===w.japanese&&(ex.furigana||'')===(w.furigana||''));
      if(!isDupe){
        // Ensure unique id and category
        if(!w.cat)w.cat='custom';
        if(customWords.some(c=>c.id===w.id))w.id='custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
        customWords.push(w);mergeStats.customAdded++;
      } else {mergeStats.customSkipped++}
    });
    saveCustom();
  }
  // Merge overrides: imported values win for new keys, keep existing for conflicts
  if(data.overrides&&typeof data.overrides==='object'){
    Object.entries(data.overrides).forEach(([id,val])=>{
      if(!wordOverrides[id]){wordOverrides[id]=val;mergeStats.overridesAdded++}
    });
    saveOverrides();
  }
  // Merge SRS data: keep the further-out review date
  if(data.srs&&typeof data.srs==='object'){
    try{const curSRS=JSON.parse(localStorage.getItem(STORAGE.srs)||'{}');
    Object.entries(data.srs).forEach(([id,imp])=>{
      const cur=curSRS[id];
      if(!cur||imp.nextReview>cur.nextReview){curSRS[id]=imp}
    });
    localStorage.setItem(STORAGE.srs,JSON.stringify(curSRS));_srsCache=curSRS}catch{}
  }
  // Merge favourites
  if(data.favourites&&Array.isArray(data.favourites)){
    data.favourites.forEach(imp=>{
      const existing=favLists.find(l=>l.name===imp.name);
      if(existing){imp.ids.forEach(id=>{if(!existing.ids.includes(id))existing.ids.push(id)})}
      else{favLists.push(imp)}
    });
    saveFavourites();
  }
  renderMenu();
  const s=mergeStats;
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  migrateMerged();migrateSchedule();renderMenu();
  notice('Import merged','Progress: '+s.progNew+' new, '+s.progMerged+' updated. Custom words: '+s.customAdded+' added, '+s.customSkipped+' already here.'+(s.overridesAdded?' Edited answers: '+s.overridesAdded+'.':''));
}catch{notice('That file could not be read','Pick a .json export from this app.')}event.target.value=''};reader.readAsText(file)}

function openStats(){
  const all=getAllWords();
  const n=(lo,hi)=>all.filter(w=>{const s=getStars(w.id);return s>=lo&&s<=hi}).length;
  const newLearnt=all.filter(w=>getStars(w.id)>0||(progress[w.id]&&progress[w.id].wrongCount>0)).length;
  const ls=getLifetimeStats();
  const total=ls.correct+ls.incorrect;
  const acc=total>0?Math.round((ls.correct/total)*100):0;
  const row=(dot,label,v)=>'<div class="statrow">'+(dot?'<span class="lvdot '+dot+'"></span>':'')+'<span>'+label+'</span><span class="v">'+v+'</span></div>';
  openSheet(`<h3>Stats</h3>
    <div class="inset"><span class="label">Words</span>
      ${row('lv1','Learning, 1 to 2 stars',n(1,2))}${row('lv2','Familiar, 3 to 5',n(3,5))}${row('lv3','Strong, 6 to 8',n(6,8))}${row('lv4','Mastered, 9',n(9,9))}
      ${row('','Seen so far',newLearnt+' / '+all.length)}</div>
    <div class="inset"><span class="label">All answers</span>
      ${row('','Correct',ls.correct.toLocaleString())}${row('','Wrong',ls.incorrect.toLocaleString())}${row('','Accuracy',acc+'%')}</div>
    <div class="inset"><span class="label">Last 13 weeks</span><div id="stats-heatmap"></div></div>
    <button class="btn full" onclick="closeSheet(this)">Close</button>`);
  renderHeatmap();
}
function renderHeatmap(){
  const el=document.getElementById('stats-heatmap');if(!el)return;
  const log=getActivityLog();
  const now=new Date();
  const days=[];
  for(let i=90;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const key=localDate(d);
    const entry=log[key];
    const total=entry?(entry.correct+entry.incorrect):0;
    days.push({key,total,dow:d.getDay()});
  }
  const maxAct=Math.max(1,...days.map(d=>d.total));
  const shades=['var(--raised)','color-mix(in srgb,var(--accent) 25%,var(--ground))','color-mix(in srgb,var(--accent) 45%,var(--ground))','color-mix(in srgb,var(--accent) 70%,var(--ground))','var(--accent)'];
  const shade=t=>t===0?shades[0]:shades[Math.min(4,1+Math.floor(t/maxAct*3.999))];
  const padded=[];
  const firstDow=days[0].dow;
  const mondayOffset=firstDow===0?6:firstDow-1;
  for(let i=0;i<mondayOffset;i++)padded.push(null);
  padded.push(...days);
  const cols=Math.ceil(padded.length/7);
  let h='<div class="heat"><div class="col">'+['M','','W','','F','','S'].map(l=>'<span class="lab">'+l+'</span>').join('')+'</div>';
  for(let c=0;c<cols;c++){
    h+='<div class="col">';
    for(let r=0;r<7;r++){
      const day=padded[c*7+r];
      if(!day){h+='<i style="visibility:hidden"></i>';continue}
      h+='<i title="'+day.key+': '+(day.total>0?day.total+' answers':'none')+'" style="background:'+shade(day.total)+'"></i>';
    }
    h+='</div>';
  }
  h+='</div><div class="heat-key">Less '+shades.map(c=>'<i style="background:'+c+'"></i>').join('')+' More</div>';
  el.innerHTML=h;
}

function reverseAnswers(w){
  // English to Japanese: every word that lists the prompt as a meaning is a right answer
  // (the prompt "good morning" fits both おはよう and おはようございます), in kanji, kana or a listed alternative reading.
  const p=w.english[0].trim().toLowerCase();const out=[];
  getAllWords().forEach(x=>{if(x.id===w.id||x.english.some(e=>e.trim().toLowerCase()===p)){out.push(x.japanese);if(x.furigana)out.push(x.furigana);if(x.alt)out.push(...x.alt)}});
  return [...new Set(out)];
}
// Listening: words that sound the same cannot be told apart, so any of their meanings is right (きる: cut or wear).
function listenAnswers(w){
  const r=w.furigana||w.japanese;const out=[...w.english];
  getAllWords().forEach(x=>{if(x.id!==w.id&&isCharMode(x)===isCharMode(w)&&(x.furigana||x.japanese)===r)out.push(...x.english)});
  return [...new Set(out)];
}
